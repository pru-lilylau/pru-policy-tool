<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保誠家庭保單總覽 | Prudential Family Policy Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --pru-red: #E31837;
  --pru-red-dark: #B5122B;
  --pru-red-light: #FEF0F2;
  --pru-navy: #003865;
  --pru-navy-mid: #004F8B;
  --pru-navy-light: #EAF1F8;
  --pru-navy-xlight: #F4F8FC;
  --white: #ffffff;
  --gray-50: #F7F8FA;
  --gray-100: #EEF1F5;
  --gray-200: #DDE2EA;
  --gray-400: #9AA5B4;
  --gray-600: #52606D;
  --gray-800: #1F2933;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.12);
  --transition: all .18s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font); background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

/* ─── OVERLAY ─── */
#overlay { position: fixed; inset: 0; background: linear-gradient(135deg, #001f3d 0%, var(--pru-navy) 60%, #004f8b 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
.ov-logo { color: var(--white); font-size: 30px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 2px; }
.ov-sub { color: rgba(255,255,255,.45); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 44px; }
.ov-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 36px 32px 28px; width: 320px; backdrop-filter: blur(12px); }
.ov-label { color: rgba(255,255,255,.55); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; text-align: center; }
.ov-pin { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
.ov-dot { width: 50px; height: 54px; background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); border-radius: 12px; color: var(--white); font-size: 24px; font-weight: 600; text-align: center; line-height: 54px; letter-spacing: 4px; cursor: default; transition: var(--transition); }
.ov-dot.filled { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.35); }
.ov-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.ov-key { background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; color: var(--white); font-size: 18px; font-weight: 500; height: 52px; cursor: pointer; transition: var(--transition); font-family: var(--font); }
.ov-key:hover { background: rgba(255,255,255,.18); transform: scale(1.04); }
.ov-key:active { transform: scale(.97); }
.ov-key.del { font-size: 14px; color: rgba(255,255,255,.5); }
.ov-key.empty { pointer-events: none; background: transparent; border-color: transparent; }
.ov-error { color: #FF6B6B; font-size: 12px; text-align: center; margin-top: 14px; min-height: 18px; }
.ov-hint { color: rgba(255,255,255,.28); font-size: 11px; text-align: center; margin-top: 14px; }

/* ─── SETUP MODAL ─── */
#setup-modal { display: none; position: fixed; inset: 0; background: rgba(0,56,101,.85); backdrop-filter: blur(8px); z-index: 900; align-items: center; justify-content: center; }
#setup-modal.show { display: flex; }
.setup-card { background: var(--white); border-radius: 16px; padding: 32px; width: 480px; max-width: 95vw; box-shadow: var(--shadow-lg); }
.setup-title { font-size: 18px; font-weight: 600; color: var(--pru-navy); margin-bottom: 6px; }
.setup-sub { font-size: 13px; color: var(--gray-600); margin-bottom: 24px; line-height: 1.6; }
.setup-step { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
.step-num { width: 24px; height: 24px; background: var(--pru-navy); color: var(--white); border-radius: 50%; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.step-text { font-size: 13px; color: var(--gray-600); line-height: 1.6; }
.step-text a { color: var(--pru-navy-mid); }
.setup-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
.setup-input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 13px; color: var(--gray-800); }
.setup-input:focus { outline: none; border-color: var(--pru-navy); }
.btn-save-token { padding: 10px 18px; background: var(--pru-navy); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: var(--font); }
.btn-save-token:hover { background: var(--pru-navy-mid); }
.setup-token-status { font-size: 12px; color: var(--gray-400); }
.setup-token-status.ok { color: #276B0C; }
.setup-pin-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.setup-pin-input { width: 140px; padding: 10px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 18px; letter-spacing: 8px; color: var(--gray-800); }
.setup-pin-input:focus { outline: none; border-color: var(--pru-navy); }
.btn-done { width: 100%; padding: 12px; background: var(--pru-red); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.btn-done:hover { background: var(--pru-red-dark); }

/* ─── MAIN LAYOUT ─── */
#app { display: none; min-height: 100vh; }
#app.show { display: block; }
.topbar { background: var(--pru-navy); padding: 0 24px; height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,.18); }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo { color: var(--white); font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
.topbar-divider { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
.topbar-subtitle { color: rgba(255,255,255,.5); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.topbar-btn { padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: var(--transition); border: 1px solid transparent; }
.tb-ghost { background: rgba(255,255,255,.1); color: var(--white); border-color: rgba(255,255,255,.15); }
.tb-ghost:hover { background: rgba(255,255,255,.2); }
.tb-red { background: var(--pru-red); color: var(--white); }
.tb-red:hover { background: var(--pru-red-dark); }
.tb-white { background: var(--white); color: var(--pru-navy); font-weight: 600; }
.tb-white:hover { background: #EAF1F8; }
.red-bar { height: 3px; background: linear-gradient(90deg, var(--pru-red) 0%, #ff6b6b 100%); }

/* ─── SIDEBAR + CONTENT ─── */
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 61px); }
.sidebar { background: var(--white); border-right: 1px solid var(--gray-200); padding: 20px 0; overflow-y: auto; }
.sb-section { padding: 0 16px; margin-bottom: 4px; }
.sb-label { font-size: 10px; font-weight: 700; color: var(--gray-400); text-transform: uppercase; letter-spacing: .12em; padding: 8px 4px 6px; }
.sb-search { display: flex; align-items: center; gap: 8px; background: var(--gray-100); border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 8px; transition: var(--transition); }
.sb-search:focus-within { background: var(--pru-navy-light); }
.sb-search input { border: none; background: transparent; font-size: 13px; color: var(--gray-800); font-family: var(--font); flex: 1; outline: none; }
.sb-search input::placeholder { color: var(--gray-400); }
.sb-client { padding: 9px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: var(--transition); border-left: 3px solid transparent; }
.sb-client:hover { background: var(--gray-50); }
.sb-client.active { background: var(--pru-navy-light); border-left-color: var(--pru-navy); }
.sb-avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--white); flex-shrink: 0; }
.sb-info { flex: 1; min-width: 0; }
.sb-name { font-size: 13px; font-weight: 500; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-meta { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
.sb-new { padding: 8px 16px; }
.sb-new-btn { width: 100%; padding: 9px; background: none; border: 1.5px dashed var(--pru-red); border-radius: var(--radius-sm); color: var(--pru-red); font-size: 12px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: var(--transition); }
.sb-new-btn:hover { background: var(--pru-red-light); }
.sb-empty { padding: 20px 16px; text-align: center; color: var(--gray-400); font-size: 12px; line-height: 1.7; }

/* ─── MAIN CONTENT ─── */
.content { padding: 28px 32px; overflow-y: auto; background: var(--gray-50); }
.content-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.content-title { font-size: 20px; font-weight: 700; color: var(--pru-navy); }
.content-actions { display: flex; gap: 8px; }
.btn { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); border: 1px solid transparent; transition: var(--transition); }
.btn-primary { background: var(--pru-navy); color: var(--white); }
.btn-primary:hover { background: var(--pru-navy-mid); }
.btn-danger { background: var(--pru-red); color: var(--white); }
.btn-danger:hover { background: var(--pru-red-dark); }
.btn-ghost { background: var(--white); color: var(--gray-600); border-color: var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); }

/* ─── FORM SECTIONS ─── */
.form-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow); transition: var(--transition); }
.form-card:hover { box-shadow: 0 4px 20px rgba(0,56,101,.08); }
.form-card-title { font-size: 11px; font-weight: 700; color: var(--pru-navy); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 16px; padding-left: 10px; border-left: 3px solid var(--pru-red); display: flex; align-items: center; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.grid1 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; }
.field label { font-size: 10.5px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .05em; }
.field input, .field select, .field textarea { padding: 8px 11px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-xs); font-family: var(--font); font-size: 13px; color: var(--gray-800); transition: var(--transition); background: var(--white); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pru-navy); box-shadow: 0 0 0 3px rgba(0,56,101,.08); }
.field textarea { resize: vertical; min-height: 52px; }

/* ─── POLICY CARDS ─── */
.policy-card { background: var(--gray-50); border: 1.5px solid var(--gray-200); border-top: 3px solid var(--pru-red); border-radius: 0 0 var(--radius) var(--radius); padding: 16px; margin-bottom: 10px; transition: var(--transition); }
.policy-card:hover { border-color: #c8d2dc; border-top-color: var(--pru-red); }
.policy-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.policy-type-sel { font-size: 12px; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--gray-200); background: var(--white); font-family: var(--font); color: var(--pru-navy); font-weight: 600; cursor: pointer; }
.policy-remove { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 18px; padding: 2px; line-height: 1; transition: var(--transition); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
.policy-remove:hover { color: var(--pru-red); background: var(--pru-red-light); }
.add-policy-btn { width: 100%; padding: 9px; background: none; border: 1.5px dashed var(--gray-200); border-radius: var(--radius-sm); color: var(--gray-400); font-size: 12px; cursor: pointer; font-family: var(--font); margin-top: 4px; transition: var(--transition); }
.add-policy-btn:hover { background: var(--gray-100); color: var(--gray-600); border-color: var(--gray-400); }
.add-member-btn { width: 100%; padding: 11px; background: none; border: 2px dashed var(--pru-red); border-radius: var(--radius-sm); color: var(--pru-red); font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font); margin-bottom: 16px; transition: var(--transition); }
.add-member-btn:hover { background: var(--pru-red-light); }

/* ─── MEMBER CARD ─── */
.member-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); transition: var(--transition); }
.member-card:hover { box-shadow: 0 4px 20px rgba(0,56,101,.1); }
.member-header { background: linear-gradient(135deg, var(--pru-navy) 0%, var(--pru-navy-mid) 100%); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.member-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.22); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; border: 2px solid rgba(255,255,255,.3); }
.member-name-display { flex: 1; color: var(--white); font-size: 15px; font-weight: 600; }
.member-remove { background: none; border: none; cursor: pointer; color: rgba(255,255,255,.4); font-size: 20px; padding: 0; transition: var(--transition); }
.member-remove:hover { color: rgba(255,255,255,.85); }
.member-body { padding: 16px; }
.member-policies-section { margin-top: 12px; }
.policies-label { font-size: 10px; font-weight: 700; color: var(--pru-navy); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; padding-left: 8px; border-left: 2px solid var(--pru-red); }

/* ─── EXTRA BOXES ─── */
.extra-box { border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 10px; border: 1px solid transparent; }
.med-box { background: var(--pru-navy-light); border-color: #b5d4f4; }
.acc-box { background: #FEF7EC; border-color: #fac775; }
.sav-box { background: #EDF5E6; border-color: #c0dd97; }
.extra-box-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; padding-left: 7px; border-left: 2px solid; border-radius: 0; }
.med-box .extra-box-title { color: var(--pru-navy); border-color: var(--pru-navy); }
.acc-box .extra-box-title { color: #7A4500; border-color: #EF9F27; }
.sav-box .extra-box-title { color: #276B0C; border-color: #276B0C; }
.sv-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; }
.sv-cell { background: var(--white); border: 1px solid #c0dd97; border-radius: var(--radius-xs); padding: 8px 10px; text-align: center; }
.sv-cell-label { font-size: 10px; color: #276B0C; margin-bottom: 4px; font-weight: 600; }
.sv-cell input { border: none; background: transparent; font-size: 13px; font-weight: 600; text-align: center; width: 100%; padding: 0; font-family: var(--mono); color: #276B0C; outline: none; }
.autofill-badge { display: none; font-size: 10px; background: #EDF5E6; color: #276B0C; border: 1px solid #c0dd97; border-radius: 20px; padding: 1px 8px; margin-left: 6px; font-weight: 600; }

/* ─── PREVIEW ─── */
.preview-section { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); overflow: hidden; box-shadow: var(--shadow); }
.pru-preview { font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; font-size: 13px; }
.pru-header { background: #003865; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
.pru-logo { color: #fff; font-size: 20px; font-weight: 700; }
.pru-logo-sub { color: rgba(255,255,255,.55); font-size: 11px; margin-top: 2px; }
.pru-header-meta { text-align: right; font-size: 12px; color: rgba(255,255,255,.7); line-height: 1.8; }
.pru-redbar { height: 4px; background: #E31837; }
.pru-body { padding: 18px 20px; }
.pru-client-card { background: #EAF1F8; border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
.pru-client-name { font-size: 17px; font-weight: 700; color: #003865; }
.pru-client-meta { font-size: 12px; color: #555; margin-top: 3px; }
.pru-total { display: flex; justify-content: space-between; align-items: center; background: #FEF0F2; border: 0.5px solid #f5c0c9; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; }
.pru-total-label { font-size: 12px; color: #B5122B; font-weight: 500; }
.pru-total-val { font-size: 18px; font-weight: 700; color: #E31837; }
.pru-member-block { margin-bottom: 16px; border: 0.5px solid #ddd; border-radius: 8px; overflow: hidden; }
.pru-member-header { background: #003865; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.pru-m-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.pru-m-info { flex: 1; }
.pru-m-name { color: #fff; font-size: 15px; font-weight: 700; }
.pru-m-meta { color: rgba(255,255,255,.65); font-size: 11px; margin-top: 2px; }
.pru-m-total { font-size: 11px; color: rgba(255,255,255,.85); font-weight: 600; text-align: right; }
.pru-policies { padding: 12px 14px; }
.pru-policy { border: 0.5px solid #e8e8e8; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.pru-policy-top { padding: 8px 12px; background: #f8f8f8; border-bottom: 0.5px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; }
.pru-policy-name { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-top: 5px; }
.pru-policy-no { font-size: 10px; color: #888; margin-top: 2px; }
.pru-policy-prem { text-align: right; flex-shrink: 0; }
.pru-policy-mode { font-size: 11px; color: #888; }
.pru-policy-amount { font-size: 13px; font-weight: 700; color: #1a1a1a; }
.pru-policy-body { padding: 8px 12px; }
.pru-info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.pru-info-cell .lbl { font-size: 10px; color: #888; margin-bottom: 2px; }
.pru-info-cell .val { font-size: 12px; font-weight: 600; color: #1a1a1a; }
.pru-med-box { margin-top: 8px; background: #EAF1F8; border-radius: 6px; padding: 8px 10px; }
.pru-acc-box { margin-top: 8px; background: #FEF7EC; border-radius: 6px; padding: 8px 10px; }
.pru-sav-box { margin-top: 8px; background: #EDF5E6; border-radius: 6px; padding: 8px 10px; }
.pru-box-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; padding-left: 5px; border-left: 2px solid; border-radius: 0; }
.pru-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; border: 0.5px solid; display: inline-block; margin-bottom: 5px; }
.pru-footer { background: #003865; padding: 12px 20px; font-size: 10.5px; color: rgba(255,255,255,.55); line-height: 1.8; }
.pru-footer-rmk { background: #EAF1F8; border-left: 3px solid #003865; padding: 10px 14px; margin-top: 8px; font-size: 12px; color: #003865; }
.hkd-hint { font-size: 10px; color: #888; font-weight: 400; }

/* ─── STATUS TOAST ─── */
#toast { position: fixed; bottom: 24px; right: 24px; background: var(--gray-800); color: var(--white); padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok { background: #276B0C; }
#toast.err { background: var(--pru-red); }

/* ─── CLIENT MODAL ─── */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 800; align-items: center; justify-content: center; }
.modal-backdrop.show { display: flex; }
.modal-card { background: var(--white); border-radius: 14px; padding: 28px; width: 420px; max-width: 95vw; }
.modal-title { font-size: 16px; font-weight: 600; color: var(--pru-navy); margin-bottom: 16px; }
.modal-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
.modal-client-row { padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; }
.modal-client-row:hover { background: var(--pru-navy-light); }

function pinKey(k) {
  if (pinInput.length >= 4) return;
  pinInput += k;
  updatePinDots();
  if (pinInput.length === 4) setTimeout(checkPin, 250);
}
function pinDel() { pinInput = pinInput.slice(0,-1); updatePinDots(); }
function updatePinDots() {
  for(let i=0;i<4;i++){
    const d=document.getElementById('d'+i);
    d.textContent = i < pinInput.length ? '●' : '·';
    d.classList.toggle('filled', i < pinInput.length);
  }
}
function checkPin() {
  let stored = '';
  try { stored = localStorage.getItem('pru_pin') || ''; } catch(e) { stored = ''; }
  if (!stored) { openSetupModal(); return; }
  if (pinInput === stored) {
    document.getElementById('overlay').style.display='none';
    document.getElementById('app').style.display='block';
    loadSidebar();
  } else {
    document.getElementById('pin-error').textContent='PIN 碼錯誤，請重試';
    pinInput=''; updatePinDots();
    setTimeout(()=>{ try{document.getElementById('pin-error').textContent='';}catch(e){} },2000);
  }
}

function verifyToken() {
  const token = document.getElementById('token-input').value.trim();
  if(!token){showToast('請輸入 Token','err');return;}
  const st=document.getElementById('token-status');
  // 直接儲存，唔做線上驗證（避免 CORS 問題），第一次儲存客戶時會自動驗證
  localStorage.setItem('pru_gh_token', token);
  st.textContent='✓ Token 已儲存';
  st.className='setup-token-status ok';
}
function saveSetup() {
  const pin=document.getElementById('pin-setup').value;
  const token=document.getElementById('token-input').value.trim()||localStorage.getItem('pru_gh_token');
  if(!token){alert('請輸入 GitHub Token');return;}
  if(pin.length!==4||!/^\d+$/.test(pin)){alert('請輸入4位數字PIN碼');return;}
  try{
    localStorage.setItem('pru_gh_token', token);
    localStorage.setItem('pru_pin', pin);
  }catch(e){alert('儲存設定失敗：'+e.message);return;}
  document.getElementById('setup-modal').style.display='none';
  document.getElementById('overlay').style.display='none';
  document.getElementById('app').style.display='block';
  loadSidebar();
}
function showSettings() {
  localStorage.removeItem('pru_pin');localStorage.removeItem('pru_gh_token');
  location.reload();
}

// GIST
// ════════════════════════════════════════
function getToken(){return localStorage.getItem('pru_gh_token')||'';}

async function loadSidebar() {
  const token=getToken();if(!token)return;
  try{
    const r=await fetch('https://api.github.com/gists?per_page=100',{headers:{Authorization:'token '+token}});
    const data=await r.json();
    allGists=data.filter(g=>g.description&&g.description.startsWith('PRU_CLIENT:'));
    renderSidebar(allGists);
  }catch(e){console.error(e);}
}

function renderSidebar(gists) {
  const el=document.getElementById('sb-client-list');
  if(!gists.length){el.innerHTML='<div class="sb-empty">尚未有客戶記錄</div>';return;}
  el.innerHTML=gists.map((g,i)=>{
    const name=g.description.replace('PRU_CLIENT:','');
    const date=new Date(g.updated_at).toLocaleDateString('zh-HK');
    const col=AVBG[i%AVBG.length];
    return`<div class="sb-client" onclick="loadGist('${g.id}')" id="sb-${g.id}">
      <div class="sb-avatar" style="background:${col}">${name.charAt(0)}</div>
      <div class="sb-info"><div class="sb-name">${name}</div><div class="sb-meta">${date}</div></div>
    </div>`;
  }).join('');
}

function filterSidebar(){
  const q=document.getElementById('sb-search').value.toLowerCase();
  const filtered=allGists.filter(g=>g.description.toLowerCase().includes(q));
  renderSidebar(filtered);
}

async function loadGist(id){
  const token=getToken();
  try{
    const r=await fetch(`https://api.github.com/gists/${id}`,{headers:{Authorization:'token '+token}});
    const g=await r.json();
    const file=Object.values(g.files)[0];
    const data=JSON.parse(file.content);
    currentGistId=id;
    loadFormData(data);
    document.querySelectorAll('.sb-client').forEach(el=>el.classList.remove('active'));
    const sb=document.getElementById('sb-'+id);
    if(sb)sb.classList.add('active');
    showToast('已載入：'+data.fname,'ok');
  }catch(e){showToast('載入失敗','err');}
}

async function saveToGist(){
  const token=getToken();if(!token){showToast('未設定 Token','err');return;}
  const data=collectFormData();
  const name=data.fname||'未命名客戶';
  const content=JSON.stringify(data,null,2);
  try{
    let r,method,url;
    if(currentGistId){
      // 已知 gist ID → 直接覆蓋
      method='PATCH';url=`https://api.github.com/gists/${currentGistId}`;
    }else{
      // 搜尋有冇同名 gist → 有就覆蓋，冇先新增（防 duplicate）
      const existing=allGists.find(g=>g.description==='PRU_CLIENT:'+name);
      if(existing){currentGistId=existing.id;method='PATCH';url=`https://api.github.com/gists/${existing.id}`;}
      else{method='POST';url='https://api.github.com/gists';}
    }
    r=await fetch(url,{method,headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({description:'PRU_CLIENT:'+name,public:false,files:{'client.json':{content}}})});
    const g=await r.json();
    currentGistId=g.id;
    await loadSidebar();
    showToast('已儲存：'+name,'ok');
  }catch(e){showToast('儲存失敗','err');}
}

function openClientModal(){
  renderModalList(allGists);
  document.getElementById('client-modal').classList.add('show');
  document.getElementById('modal-search-input').value='';
}
function closeClientModal(){document.getElementById('client-modal').classList.remove('show');}
function renderModalList(gists){
  const el=document.getElementById('modal-list');
  if(!gists.length){el.innerHTML='<div class="modal-empty">未有客戶記錄</div>';return;}
  el.innerHTML=gists.map((g,i)=>{
    const name=g.description.replace('PRU_CLIENT:','');
    const date=new Date(g.updated_at).toLocaleDateString('zh-HK');
    const col=AVBG[i%AVBG.length];
    return`<div class="modal-client-row" onclick="loadGist('${g.id}');closeClientModal()">
      <div class="sb-avatar" style="background:${col};width:32px;height:32px;font-size:13px;">${name.charAt(0)}</div>
      <div><div class="modal-client-name">${name}</div><div class="modal-client-meta">上次更新：${date}</div></div>
    </div>`;
  }).join('');
}
function filterModal(){
  const q=document.getElementById('modal-search-input').value.toLowerCase();
  renderModalList(allGists.filter(g=>g.description.toLowerCase().includes(q)));
}

function newClient(){
  currentGistId=null; mc=0; pC={};
  document.getElementById('fname').value='';
  // reset to family type
  const fb=document.querySelector('input[name="client-type"][value="family"]');
  if(fb){fb.checked=true;onClientTypeChange();}
  document.getElementById('rdate').value=new Date().toISOString().split('T')[0];
  document.getElementById('adv').value='';
  document.getElementById('remarks').value='';
  document.getElementById('members-container').innerHTML='';
  document.getElementById('preview-section').classList.add('hidden');
  document.querySelectorAll('.sb-client').forEach(el=>el.classList.remove('active'));
  updateTitle();
  addMember();
}
function updateTitle(){
  const n=document.getElementById('fname').value||'新客戶';
  document.getElementById('report-title').textContent=n;
}

function buildTypeOpts(){return Object.keys(PRODUCTS).map(t=>`<option value="${t}">${TYPE_ZH[t]}</option>`).join('');}
function buildProdOpts(type){return(PRODUCTS[type]||[]).map(p=>`<option value="${p.zh}||${p.en}||${p.key||''}">${p.zh}</option>`).join('');}

function fmtNum(v){if(!v)return'';const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?v:n.toLocaleString('zh-HK');}
function autoComma(el){
  const pos=el.selectionStart;
  const raw=el.value.replace(/,/g,'');
  if(raw===''||raw==='-'){return;}
  const n=parseFloat(raw);
  if(!isNaN(n)){
    const formatted=n.toLocaleString('zh-HK');
    el.value=formatted;
    // restore caret roughly
    const diff=formatted.length-el.value.length;
    try{el.setSelectionRange(pos+diff,pos+diff);}catch(e){}
  }
}

function getClientType(){const r=document.querySelector('input[name="client-type"]:checked');return r?r.value:'family';}
function onClientTypeChange(){
  const isSingle=getClientType()==='single';
  document.getElementById('fname').placeholder=isSingle?'陳大文':'陳氏家庭';
  document.getElementById('add-member-btn').textContent=isSingle?'+ 新增保單持有人':'+ 新增家庭成員';
  // update role labels in existing members
  document.querySelectorAll('.member-rel-sel').forEach(sel=>{
    const cur=sel.value;
    sel.innerHTML=buildRoleOpts(isSingle,cur);
  });
}
function buildRoleOpts(isSingle,selected){
  const roles=isSingle
    ?['本人/Self','其他/Other']
    :['父親/Father','母親/Mother','子女/Child','祖父/Grandfather','祖母/Grandmother','其他/Other'];
  return roles.map(r=>`<option value="${r}" ${selected===r?'selected':''}>${r}</option>`).join('');
}

function addMember(data){
  mc++;const mid='m'+mc;pC[mid]=0;
  const col=AVBG[(mc-1)%AVBG.length];
  const nm=data?data.name:'';
  const isSingle=getClientType()==='single';
  const roleOpts=buildRoleOpts(isSingle, data?data.role:'');
  const container=document.getElementById('members-container');
  container.insertAdjacentHTML('beforeend',`
  <div class="member-card" id="${mid}">
    <div class="member-header">
      <div class="member-avatar" id="${mid}av" style="background:${col}">${nm?nm.charAt(0):'家'}</div>
      <div class="member-name-display" id="${mid}ttl">${nm||'新成員'}</div>
      <button class="member-remove" onclick="document.getElementById('${mid}').remove()" aria-label="移除成員">×</button>
    </div>
    <div class="member-body">
      <div class="grid3" style="margin-bottom:12px;">
        <div class="field"><label>姓名</label><input type="text" id="${mid}nm" value="${data?data.name:''}" placeholder="陳大文" oninput="updMember('${mid}')"></div>
        <div class="field"><label>出生日期</label><input type="date" id="${mid}dob" value="${data?data.dob:''}"></div>
        <div class="field"><label>身份</label><select id="${mid}rel" class="member-rel-sel">${roleOpts}</select></div>
      </div>
      <div class="grid4">
        <div class="field"><label>投保人</label><input type="text" id="${mid}own" value="${data?data.owner:''}" placeholder="本人"></div>
        <div class="field"><label>受保人</label><input type="text" id="${mid}ins" value="${data?data.insured:''}" placeholder="本人"></div>
        <div class="field"><label>受益人</label><input type="text" id="${mid}ben" value="${data?data.beneficiary:''}" placeholder="配偶/子女"></div>
        <div class="field"><label>吸煙</label><select id="${mid}sk"><option value="NS" ${!data||data.smoke==='NS'?'selected':''}>非吸煙</option><option value="S" ${data&&data.smoke==='S'?'selected':''}>吸煙</option></select></div>
      </div>
      <div class="member-policies-section">
        <div class="policies-label">保單</div>
        <div id="${mid}pl"></div>
        <button class="add-policy-btn" onclick="addPolicy('${mid}')">+ 新增保單</button>
      </div>
    </div>
  </div>`);
  if(data&&data.policies&&data.policies.length){data.policies.forEach(p=>addPolicy(mid,p));}
  else{addPolicy(mid);}
}

function updMember(mid){
  const nm=document.getElementById(mid+'nm').value;
  document.getElementById(mid+'ttl').textContent=nm||'新成員';
  document.getElementById(mid+'av').textContent=nm?nm.charAt(0):'家';
}

function addPolicy(mid, data){
  pC[mid]=(pC[mid]||0)+1;const pid=mid+'p'+pC[mid];
  const cO=['HKD','USD','RMB','GBP'].map(c=>`<option value="${c}" ${data&&data.currency===c?'selected':''}>${c}</option>`).join('');
  const mO=['annual','monthly','quarterly'].map(m=>`<option value="${m}" ${data&&data.mode===m?'selected':''}>${{annual:'年繳',monthly:'月繳',quarterly:'季繳'}[m]}</option>`).join('');
  const typeVal=data?data.type:'medical';
  const tO=buildTypeOpts().replace(`value="${typeVal}"`,`value="${typeVal}" selected`);
  const prodOpts=buildProdOpts(typeVal);
  document.getElementById(mid+'pl').insertAdjacentHTML('beforeend',`
  <div class="policy-card" id="${pid}">
    <div class="policy-card-top">
      <select class="policy-type-sel" id="${pid}t" onchange="onTypeChange('${pid}')">${tO}</select>
      <button class="policy-remove" onclick="document.getElementById('${pid}').remove()" aria-label="移除保單">×</button>
    </div>
    <div class="grid2" style="margin-bottom:10px;">
      <div class="field"><label>計劃名稱</label>
        <select id="${pid}npick" onchange="onPlanPick('${pid}')" style="font-size:13px;">${prodOpts}</select>
        <input type="text" id="${pid}ncustom" placeholder="自行輸入計劃名稱" style="display:none;margin-top:6px;" class="field input">
      </div>
      <div class="field"><label>保單號碼</label><input type="text" id="${pid}no" value="${data?data.policyNo:''}" placeholder="12345678"></div>
    </div>
    <div class="grid4" style="margin-bottom:10px;">
      <div class="field"><label>繳費</label><select id="${pid}m">${mO}</select></div>
      <div class="field"><label>貨幣</label><select id="${pid}c">${cO}</select></div>
      <div class="field"><label>保費</label><input type="text" id="${pid}pr" value="${data?fmtNum(data.premium):''}" placeholder="5,000" oninput="autoComma(this)"></div>
      <div class="field"><label>保額</label><input type="text" id="${pid}sa" value="${data?fmtNum(data.sumAssured):''}" placeholder="1,000,000" oninput="autoComma(this)"></div>
    </div>
    <div class="grid3">
      <div class="field"><label>生效日期</label><input type="date" id="${pid}e" value="${data?data.effectiveDate:''}"></div>
      <div class="field"><label>繳費年期</label><input type="text" id="${pid}tm" value="${data?data.paymentTerm:''}" placeholder="20年"></div>
      <div class="field"><label>下次檢視</label><input type="date" id="${pid}rv" value="${data?data.nextReview:''}"></div>
    </div>
    <div id="${pid}med" class="extra-box med-box" style="${typeVal==='medical'?'':'display:none'}">
      <div class="extra-box-title">醫療保障詳情 <span id="${pid}autobadge" class="autofill-badge">✦ 自動填入</span></div>
      <div class="grid2" style="margin-bottom:8px;">
        <div class="field"><label>病房級別</label><select id="${pid}wd" onchange="onWardChange('${pid}')" style="font-size:13px;"><option value="">選擇病房</option></select></div>
        <div class="field"><label>自付額</label>
          <select id="${pid}ddsel" onchange="onDdChange('${pid}')" style="font-size:13px;"><option value="">選擇自付額</option></select>
          <input type="text" id="${pid}dd" placeholder="自行輸入" style="display:none;margin-top:6px;">
        </div>
      </div>
      <div class="grid2">
        <div class="field"><label>每年保額</label><input type="text" id="${pid}al" value="${data?data.annualLimit:''}" placeholder="自動填入或手動輸入"></div>
        <div class="field"><label>終生保額</label><input type="text" id="${pid}ll" value="${data?data.lifetimeLimit:''}" placeholder="自動填入或手動輸入"></div>
      </div>
    </div>
    <div id="${pid}acc" class="extra-box acc-box" style="${typeVal==='accident'?'':'display:none'}">
      <div class="extra-box-title">意外保障詳情</div>
      <div class="grid3">
        <div class="field"><label>意外醫療保額</label><input type="text" id="${pid}am" value="${data?data.accMed:''}" placeholder="200,000"></div>
        <div class="field"><label>意外身故保額</label><input type="text" id="${pid}ad" value="${data?data.accDeath:''}" placeholder="500,000"></div>
        <div class="field"><label>永久傷殘保額</label><input type="text" id="${pid}ap" value="${data?data.accDisable:''}" placeholder="500,000"></div>
      </div>
    </div>
    <div id="${pid}sav" class="extra-box sav-box" style="${(typeVal==='savings'||typeVal==='income')?'':'display:none'}">
      <div class="extra-box-title">退保價值</div>
      <div class="sv-grid">
        <div class="field"><label>貨幣</label><select id="${pid}svc" style="width:auto;">${cO}</select></div>
        <div class="sv-cell"><div class="sv-cell-label">65歲退保值</div><input type="text" id="${pid}s65" value="${data?data.sv65:''}" placeholder="000,000"></div>
        <div class="sv-cell"><div class="sv-cell-label">75歲退保值</div><input type="text" id="${pid}s75" value="${data?data.sv75:''}" placeholder="000,000"></div>
      </div>
    </div>
  </div>`);
  if(data&&data.planName){
    const pick=document.getElementById(pid+'npick');
    if(pick){
      for(let i=0;i<pick.options.length;i++){
        if(pick.options[i].value.startsWith(data.planName)){pick.selectedIndex=i;break;}
      }
    }
  }
  initMedSelects(pid, data);
}

function initMedSelects(pid, data){
  const wdSel=document.getElementById(pid+'wd');
  const ddSel=document.getElementById(pid+'ddsel');
  if(!wdSel||!ddSel)return;
  wdSel.innerHTML='<option value="">選擇病房</option>'+['私家病房','半私家病房','普通病房','不設病房限制'].map(w=>`<option value="${w}" ${data&&data.ward===w?'selected':''}>${w}</option>`).join('');
  ddSel.innerHTML='<option value="">選擇自付額</option><option value="custom">自行輸入</option>';
  const pick=document.getElementById(pid+'npick');
  if(pick){const parts=pick.value.split('||');const key=parts[2]||'';autofillMedical(pid,key,data);}
  if(data&&data.deductible){
    const ddSel2=document.getElementById(pid+'ddsel');
    const found=[...ddSel2.options].some(o=>o.value===data.deductible);
    if(!found){ddSel2.insertAdjacentHTML('beforeend',`<option value="${data.deductible}" selected>${data.deductible}</option>`);}
    else{ddSel2.value=data.deductible;}
  }
}

function onTypeChange(pid){
  const t=document.getElementById(pid+'t').value;
  const pick=document.getElementById(pid+'npick');
  if(pick)pick.innerHTML=buildProdOpts(t);
  onPlanPick(pid);
  ['med','acc','sav'].forEach(k=>{const el=document.getElementById(pid+k);if(el)el.style.display='none';});
  if(t==='medical'){const el=document.getElementById(pid+'med');if(el)el.style.display='block';}
  else if(t==='accident'){const el=document.getElementById(pid+'acc');if(el)el.style.display='block';}
  else if(t==='savings'||t==='income'){const el=document.getElementById(pid+'sav');if(el)el.style.display='block';}
}

function onPlanPick(pid){
  const pick=document.getElementById(pid+'npick');
  const custom=document.getElementById(pid+'ncustom');
  if(!pick||!custom)return;
  const isC=pick.value.includes('自行輸入')||pick.value.includes('custom');
  custom.style.display=isC?'block':'none';
  const parts=pick.value.split('||');
  autofillMedical(pid,parts[2]||'',null);
}

function autofillMedical(pid,key,data){
  const badge=document.getElementById(pid+'autobadge');
  const wdSel=document.getElementById(pid+'wd');
  const ddSel=document.getElementById(pid+'ddsel');
  const alInput=document.getElementById(pid+'al');
  const llInput=document.getElementById(pid+'ll');
  if(!wdSel||!ddSel||!alInput||!llInput)return;
  const mdata=key?MEDICAL_DATA[key]:null;
  if(!mdata){if(badge)badge.style.display='none';return;}
  if(badge)badge.style.display='inline-block';
  const savedWard=data?data.ward:null;
  wdSel.innerHTML='<option value="">選擇病房</option>'+mdata.wards.map(w=>`<option value="${w}" ${savedWard===w?'selected':''}>${w}</option>`).join('');
  if(mdata.wards.length===1&&!savedWard)wdSel.value=mdata.wards[0];
  ddSel.innerHTML='<option value="">選擇自付額</option>'+mdata.deductibles.map(d=>`<option value="${d}">${d}</option>`).join('')+'<option value="custom">自行輸入</option>';
  if(!data){
    llInput.value=mdata.lifetimeLimit||'';
    if(mdata.wards.length===1)alInput.value=mdata.annualLimits[mdata.wards[0]]||'';
  }
}

function onWardChange(pid){
  const pick=document.getElementById(pid+'npick');
  const wdSel=document.getElementById(pid+'wd');
  const alInput=document.getElementById(pid+'al');
  if(!pick||!wdSel||!alInput)return;
  const key=pick.value.split('||')[2]||'';
  const mdata=key?MEDICAL_DATA[key]:null;
  if(mdata&&mdata.annualLimits&&mdata.annualLimits[wdSel.value])alInput.value=mdata.annualLimits[wdSel.value];
}

function onDdChange(pid){
  const ddSel=document.getElementById(pid+'ddsel');
  const ddInput=document.getElementById(pid+'dd');
  if(!ddSel||!ddInput)return;
  ddInput.style.display=ddSel.value==='custom'?'block':'none';
}

function getPlanName(pid){
  const pick=document.getElementById(pid+'npick');
  const custom=document.getElementById(pid+'ncustom');
  if(!pick)return'';
  const isC=pick.value.includes('自行輸入')||pick.value.includes('custom');
  if(isC)return custom?custom.value:'';
  return pick.value.split('||')[0]||'';
}
function getWard(pid){const s=document.getElementById(pid+'wd');return s?s.value||'—':'—';}
function getDd(pid){const s=document.getElementById(pid+'ddsel');const i=document.getElementById(pid+'dd');if(!s)return'—';return s.value==='custom'?(i?i.value||'—':'—'):(s.value||'—');}

// ════════════════════════════════════════
// COLLECT / LOAD DATA
// ════════════════════════════════════════
function collectFormData(){
  const members=[...document.querySelectorAll('.member-card')].map(m=>{
    const mid=m.id;
    const policies=[...m.querySelectorAll('.policy-card')].map(p=>{
      const pid=p.id;
      const type=document.getElementById(pid+'t').value;
      return{
        type,planName:getPlanName(pid),
        policyNo:v(pid+'no'),mode:v(pid+'m'),currency:v(pid+'c'),
        premium:v(pid+'pr'),sumAssured:v(pid+'sa'),
        effectiveDate:v(pid+'e'),paymentTerm:v(pid+'tm'),nextReview:v(pid+'rv'),
        ward:getWard(pid),deductible:getDd(pid),
        annualLimit:v(pid+'al'),lifetimeLimit:v(pid+'ll'),
        accMed:v(pid+'am'),accDeath:v(pid+'ad'),accDisable:v(pid+'ap'),
        sv65:v(pid+'s65'),sv75:v(pid+'s75'),svcur:v(pid+'svc')
      };
    });
    return{name:v(mid+'nm'),dob:v(mid+'dob'),role:v(mid+'rel'),owner:v(mid+'own'),insured:v(mid+'ins'),beneficiary:v(mid+'ben'),smoke:v(mid+'sk'),policies};
  });
  return{fname:v('fname'),rdate:v('rdate'),adv:v('adv'),remarks:v('remarks'),clientType:getClientType(),members};
}

function v(id){const el=document.getElementById(id);return el?el.value:'';}

function loadFormData(data){
  mc=0;pC={};
  document.getElementById('fname').value=data.fname||'';
  document.getElementById('rdate').value=data.rdate||new Date().toISOString().split('T')[0];
  document.getElementById('adv').value=data.adv||'';
  document.getElementById('remarks').value=data.remarks||'';
  // restore client type
  const ct=data.clientType||'family';
  const rBtn=document.querySelector(`input[name="client-type"][value="${ct}"]`);
  if(rBtn){rBtn.checked=true;onClientTypeChange();}
  document.getElementById('members-container').innerHTML='';
  document.getElementById('preview-section').classList.add('hidden');
  if(data.members&&data.members.length){data.members.forEach(m=>addMember(m));}
  else{addMember();}
  updateTitle();
}

// FX rates to HKD (approximate reference)
const FX_TO_HKD = { HKD: 1, USD: 7.78, RMB: 1.07, CNY: 1.07, GBP: 9.85, EUR: 8.30 };
function toHKD(amount, currency) {
  const rate = FX_TO_HKD[currency] || 0;
  return rate ? Math.round(amount * rate) : null;
}
function fmt(n) { return Math.round(n).toLocaleString('zh-HK'); }
function fmtAmt(numStr, currency) {
  if(!numStr) return '—';
  const raw = parseFloat(String(numStr).replace(/,/g,''));
  if(isNaN(raw)) return numStr;
  const formatted = fmt(raw);
  if(currency && currency !== 'HKD' && FX_TO_HKD[currency]) {
    const hkd = toHKD(raw, currency);
    return `${currency} ${formatted}<span class="hkd-hint"> ≈ HKD ${fmt(hkd)}</span>`;
  }
  return `${currency||''} ${formatted}`.trim();
}
function fmtAmtPlain(numStr, currency) {
  // For print (no HTML span)
  if(!numStr) return '—';
  const raw = parseFloat(String(numStr).replace(/,/g,''));
  if(isNaN(raw)) return numStr;
  const formatted = fmt(raw);
  if(currency && currency !== 'HKD' && FX_TO_HKD[currency]) {
    const hkd = toHKD(raw, currency);
    return `${currency} ${formatted} (≈ HKD ${fmt(hkd)})`;
  }
  return `${currency||''} ${formatted}`.trim();
}
function fD(v){if(!v)return'—';const d=new Date(v);if(isNaN(d))return v;return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function getAge(dob){if(!dob)return'';const d=new Date(dob),now=new Date();const age=now.getFullYear()-d.getFullYear()-(now<new Date(now.getFullYear(),d.getMonth(),d.getDate())?1:0);return`${age}歲`;}
function ic(l,v2){return`<div class="pru-info-cell"><div class="lbl">${l}</div><div class="val">${v2}</div></div>`;}

// ════ SHARED CONSTANTS ════
const WASHI_COLORS = {
  critical:'#C0392B', medical:'#2E5E8E', savings:'#4A7C3F',
  life:'#5B4A8A', income:'#1B6B5A', accident:'#B07D2A', general:'#7A7370'
};
const TYPE_ZH_MAP = {critical:'危疾',medical:'醫療',savings:'儲蓄',life:'人壽',income:'入息/傳承',accident:'意外',general:'一般保險'};
const IG_SVG = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:4px;"><rect x="2" y="2" width="20" height="20" rx="5" ry="5" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="1.2" fill="currentColor"/></svg>`;

// ════ PIE CHART DRAWING (shared) ════
function drawPieCanvas(canvasEl, pieData, size) {
  const ctx = canvasEl.getContext('2d');
  const cx = size/2, cy = size/2, r = size*0.42, inner = size*0.22;
  const total = pieData.reduce((s,d)=>s+d.val,0);
  ctx.clearRect(0,0,size,size);
  if(total===0){ ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#e8e2d8';ctx.fill();return; }
  // draw ink-textured segments
  let start = -Math.PI/2;
  pieData.forEach((d,i) => {
    const sweep = (d.val/total)*Math.PI*2 - 0.025;
    // main segment
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+sweep);
    ctx.closePath();
    ctx.fillStyle = d.color+'dd';
    ctx.fill();
    // slight ink stroke
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.stroke();

    // label on segment if >8%
    const pct = Math.round(d.val/total*100);
    if(pct >= 8) {
      const mid = start + sweep/2;
      const lx = cx + Math.cos(mid)*(r*0.68), ly = cy + Math.sin(mid)*(r*0.68);
      ctx.save();
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(size*0.072)}px Arial`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=3;
      ctx.fillText(pct+'%', lx, ly-size*0.03);
      ctx.font = `${Math.round(size*0.058)}px Arial`;
      ctx.shadowBlur=2;
      const zh = TYPE_ZH_MAP[d.type]||d.type;
      ctx.fillText(zh, lx, ly+size*0.045);
      ctx.restore();
    }
    start += sweep + 0.025;
  });
  // donut hole - washi paper style
  ctx.beginPath(); ctx.arc(cx,cy,inner,0,Math.PI*2);
  ctx.fillStyle='#faf7f2'; ctx.fill();
  ctx.strokeStyle='#d4cdc4'; ctx.lineWidth=0.5; ctx.stroke();
  // center text
  ctx.fillStyle='#5a4a3a';
  ctx.font=`bold ${Math.round(size*0.085)}px Arial`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('保障', cx, cy-size*0.035);
  ctx.font=`${Math.round(size*0.07)}px Arial`;
  ctx.fillText('分佈', cx, cy+size*0.045);
}

// ════ BUILD PIE DATA ════
function buildPieData(data) {
  const typeMap = {};
  let grandHKD = 0;
  data.members.forEach(m => {
    m.policies.forEach(p => {
      const raw = parseFloat((p.premium||'0').replace(/,/g,''));
      if(isNaN(raw)||raw<=0) return;
      const annual = p.mode==='monthly'?raw*12:p.mode==='quarterly'?raw*4:raw;
      const hkd = toHKD(annual,p.currency)||annual;
      typeMap[p.type] = (typeMap[p.type]||0)+hkd;
      grandHKD += hkd;
    });
  });
  const pieData = Object.entries(typeMap).sort((a,b)=>b[1]-a[1]).map(([t,v])=>({type:t,val:v,color:WASHI_COLORS[t]||'#999'}));
  return {pieData, grandHKD, typeMap};
}
