<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>保單管理工具 · Lily Lau</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',Arial,'Noto Sans CJK TC',sans-serif;background:#f5f0e8;color:#2a1a0a;min-height:100vh;}
button,input,select,textarea{font-family:inherit;}
/* Topbar */
#topbar{background:#A08060;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(80,55,35,.25);}
.tbtn{padding:9px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;}
.tbtn:hover{background:rgba(255,255,255,.22);}
.tbtn.primary{background:#fff;color:#003865;border-color:#fff;}
.red-stripe{height:3px;background:#E31837;}
/* Layout */
#app{display:grid;grid-template-columns:var(--sb-w,280px) 1fr;min-height:calc(100vh - 67px);transition:grid-template-columns .25s ease;}
#app.collapsed{--sb-w:44px;}
/* Sidebar */
#sidebar{background:#fdfaf5;border-right:1px solid #d8cfc0;overflow-y:auto;position:relative;transition:all .25s;}
#sb-toggle{position:absolute;top:12px;right:8px;z-index:10;width:24px;height:24px;border-radius:50%;background:#d8cfc0;border:none;cursor:pointer;font-size:12px;color:#6a5a48;}
#sb-full{padding:20px 0 0;}
#sb-collapsed{padding:48px 4px 8px;display:none;flex-direction:column;align-items:center;gap:6px;}
#app.collapsed #sb-full{display:none;}
#app.collapsed #sb-collapsed{display:flex;}
.sb-title{font-size:10px;font-weight:700;color:#9a8a78;text-transform:uppercase;letter-spacing:.12em;padding:8px 4px 6px 16px;}
.sb-search{display:flex;align-items:center;gap:8px;background:#ede6d8;border-radius:8px;padding:7px 10px;margin:0 40px 8px 16px;}
.sb-search input{border:none;background:transparent;font-size:13px;flex:1;outline:none;}
.sb-item{padding:9px 20px;cursor:pointer;display:flex;align-items:center;gap:10px;border-left:3px solid transparent;}
.sb-item:hover{background:#f0ece4;}
.sb-item.active{border-left-color:#003865;background:#EAF1F8;}
.sb-avatar{width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.sb-new{width:calc(100% - 32px);margin:8px 16px;padding:9px;background:none;border:1.5px dashed #E31837;border-radius:8px;color:#E31837;font-size:12px;font-weight:600;cursor:pointer;}
/* Content */
#content{padding:28px 32px;overflow-y:auto;}
.sec-card{background:#fdfaf5;border-radius:12px;border:1px solid #d8cfc0;padding:20px 24px;margin-bottom:16px;}
.sec-title{font-size:12px;font-weight:700;color:#003865;text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px;padding-left:10px;border-left:3px solid #E31837;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;}
.ff{display:flex;flex-direction:column;min-width:0;}
label.fl{font-size:12px;font-weight:600;color:#6a5a48;margin-bottom:4px;display:block;text-transform:uppercase;letter-spacing:.05em;}
input.fi,select.fi,textarea.fi{padding:10px 12px;border:1.5px solid #d8cfc0;border-radius:6px;font-size:14px;color:#2a1a0a;background:#fdfaf5;outline:none;width:100%;}
input.fi:focus,select.fi:focus,textarea.fi:focus{border-color:#A08060;}
input.fi[type="date"]{height:43px;line-height:normal;min-width:0;width:100%;-webkit-appearance:none;appearance:none;}
.ff{min-width:0;}
input.fi[type="date"]{min-width:0;width:100%;-webkit-appearance:none;appearance:none;}
  /* Member card */
.mc{background:#fdfaf5;border:1px solid #d8cfc0;border-radius:12px;margin-bottom:16px;overflow:hidden;}
.mc-hdr{background:#A08060;padding:14px 16px;display:flex;align-items:center;gap:12px;}
.mc-av{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;border:2px solid rgba(255,255,255,.3);flex-shrink:0;}
.mc-body{padding:16px;}
/* Policy card */
.pc{background:#faf7f2;border:1.5px solid #d8cfc0;border-top:3px solid #E31837;border-radius:0 0 12px 12px;padding:16px;margin-bottom:10px;}
.pc-toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.type-sel{font-size:12px;padding:4px 10px;border-radius:20px;color:#003865;font-weight:600;border:1.5px solid #d8cfc0;background:#fdfaf5;cursor:pointer;}
.extra-box{border-radius:8px;padding:12px 14px;margin-top:10px;}
.extra-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-left:7px;border-left:2px solid;display:block;}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px;}
.sv-cell{border-radius:5px;padding:7px 10px;text-align:center;border:0.5px solid;background:#fff;}
.sv-cell .sv-l{font-size:10px;margin-bottom:3px;}
.sv-cell .sv-v{font-size:13px;font-weight:700;border:none;background:transparent;text-align:center;width:100%;padding:0;font-family:monospace;outline:none;}
/* Buttons */
.add-policy-btn{width:100%;padding:9px;background:none;border:1.5px dashed #d8cfc0;border-radius:8px;color:#9a8a78;font-size:12px;cursor:pointer;margin-top:4px;}
.add-member-btn{width:100%;padding:11px;background:none;border:2px dashed #E31837;border-radius:8px;color:#E31837;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:16px;}
/* Modals */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:800;display:flex;align-items:center;justify-content:center;}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:420px;max-width:95vw;}
/* Toast */
#toast{position:fixed;bottom:24px;right:24px;background:#2a1a0a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateY(0);}
#toast.ok{background:#276B0C;}
#toast.err{background:#E31837;}
/* PIN */
#pin-screen{position:fixed;inset:0;background:#C4A882;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;}
.pin-box{background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.6);border-radius:20px;padding:32px 28px 24px;width:300px;}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:22px;}
.pin-dot{width:46px;height:50px;background:rgba(255,255,255,.4);border:1.5px solid rgba(255,255,255,.7);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#3D2000;transition:all .15s;}
.pin-dot.filled{background:rgba(61,32,0,.15);border-color:rgba(61,32,0,.4);}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pin-key{background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);border-radius:10px;color:#3D2000;font-size:17px;font-weight:600;height:48px;cursor:pointer;}
.pin-key:hover{background:rgba(255,255,255,.65);}
/* Setup */
#setup-modal{position:fixed;inset:0;background:rgba(0,56,101,.95);display:none;align-items:center;justify-content:center;z-index:9999;}
#setup-modal.show{display:flex;}
/* Transfer tabs */
.mtab{padding:10px 20px;border:none;cursor:pointer;font-size:14px;font-weight:600;border-bottom:2px solid transparent;color:#9a8a78;background:transparent;}
.mtab.active{border-bottom-color:#E31837;color:#E31837;}
</style>
</head>
<body>

<!-- PIN -->
<div id="pin-screen">
  <div style="color:#3D2000;font-size:26px;font-weight:700;margin-bottom:4px;">Lily Lau</div>
  <div style="color:rgba(61,32,0,.6);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:36px;">保單管理工具 · @pru_lilylau</div>
  <div class="pin-box">
    <div style="color:#3D2000;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;text-align:center;">輸入 PIN 碼</div>
    <div class="pin-dots" id="pin-dots">
      <div class="pin-dot" id="pd0">·</div><div class="pin-dot" id="pd1">·</div>
      <div class="pin-dot" id="pd2">·</div><div class="pin-dot" id="pd3">·</div>
    </div>
    <div class="pin-grid">
      <button class="pin-key" onclick="pinKey('1')">1</button><button class="pin-key" onclick="pinKey('2')">2</button><button class="pin-key" onclick="pinKey('3')">3</button>
      <button class="pin-key" onclick="pinKey('4')">4</button><button class="pin-key" onclick="pinKey('5')">5</button><button class="pin-key" onclick="pinKey('6')">6</button>
      <button class="pin-key" onclick="pinKey('7')">7</button><button class="pin-key" onclick="pinKey('8')">8</button><button class="pin-key" onclick="pinKey('9')">9</button>
      <button class="pin-key" style="background:transparent;border-color:transparent;pointer-events:none;"></button>
      <button class="pin-key" onclick="pinKey('0')">0</button>
      <button class="pin-key" style="color:rgba(61,32,0,.5);font-size:13px;" onclick="pinDel()">⌫</button>
    </div>
    <div id="pin-err" style="color:#C0392B;font-size:12px;text-align:center;margin-top:12px;min-height:18px;"></div>
    <div style="color:rgba(61,32,0,.5);font-size:11px;text-align:center;margin-top:10px;">首次使用請先設定 PIN 碼</div>
  </div>
</div>

<!-- Setup -->
<div id="setup-modal">
  <div style="background:#fff;border-radius:16px;padding:32px;width:460px;max-width:95vw;">
    <div style="font-size:17px;font-weight:600;color:#003865;margin-bottom:6px;">初次設定</div>
    <div style="font-size:13px;color:#6a5a48;margin-bottom:22px;line-height:1.6;">設定 GitHub Token 及 PIN 碼，只需做一次。</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input id="setup-tok" type="password" placeholder="ghp_xxxxxxxxxxxxxxxx" style="flex:1;padding:10px 12px;border:1.5px solid #d8cfc0;border-radius:8px;font-family:monospace;font-size:13px;outline:none;">
      <button onclick="setupVerify()" style="padding:10px 16px;background:#003865;color:#fff;border:none;border-radius:8px;cursor:pointer;">確認</button>
    </div>
    <div id="setup-status" style="font-size:12px;color:#9a8a78;margin-bottom:18px;">貼入 token 後點「確認」</div>
    <div style="font-size:13px;color:#6a5a48;margin-bottom:10px;">設定 4 位 PIN 碼</div>
    <input id="setup-pin" type="password" maxlength="4" inputmode="numeric" placeholder="••••" style="width:120px;padding:10px 12px;border:1.5px solid #d8cfc0;border-radius:8px;font-family:monospace;font-size:18px;letter-spacing:8px;outline:none;margin-bottom:20px;">
    <button onclick="setupSave()" style="width:100%;padding:12px;background:#E31837;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:500;cursor:pointer;">完成設定，進入工具</button>
  </div>
</div>

<!-- Transfer Modal -->
<div id="transfer-modal" class="overlay" style="display:none;" onclick="if(event.target===this)closeTransfer()">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:16px;font-weight:700;color:#003865;">跨裝置轉移</div>
      <button onclick="closeTransfer()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9a8a78;">×</button>
    </div>
    <div style="display:flex;border-bottom:1px solid #e8e2d8;margin-bottom:20px;">
      <button class="mtab active" id="tab-ex" onclick="switchTab('ex')">📤 匯出</button>
      <button class="mtab" id="tab-im" onclick="switchTab('im')">📥 匯入</button>
    </div>
    <div id="tr-ex">
      <div style="font-size:13px;color:#6a5a48;margin-bottom:16px;line-height:1.6;">喺新裝置選「匯入」，掃描 QR code 或貼上轉移碼。<br><span style="font-size:11px;color:#C0392B;">⚠️ 轉移碼包含 Token，請勿分享他人</span></div>
      <div style="display:flex;justify-content:center;margin-bottom:14px;"><div style="border:1px solid #d8cfc0;border-radius:8px;padding:8px;background:#fdfaf5;"><img id="qr-img" src="" width="200" height="200" style="display:block;"></div></div>
      <div style="font-size:11px;font-weight:600;color:#9a8a78;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">或複製轉移碼</div>
      <textarea id="ex-str" readonly style="width:100%;height:72px;padding:10px;border:1.5px solid #d8cfc0;border-radius:8px;font-family:monospace;font-size:11px;resize:none;background:#fdfaf5;"></textarea>
      <button onclick="copyExStr()" style="width:100%;margin-top:10px;padding:10px;background:#003865;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">📋 複製轉移碼</button>
    </div>
    <div id="tr-im" style="display:none;">
      <div style="font-size:13px;color:#6a5a48;margin-bottom:14px;">貼上從原裝置匯出的轉移碼：</div>
      <textarea id="im-str" placeholder="貼上轉移碼..." style="width:100%;height:80px;padding:10px;border:1.5px solid #d8cfc0;border-radius:8px;font-family:monospace;font-size:12px;resize:none;"></textarea>
      <div id="im-err" style="color:#E31837;font-size:12px;margin-top:6px;min-height:18px;"></div>
      <button onclick="doImport()" style="width:100%;margin-top:10px;padding:10px;background:#003865;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">匯入設定</button>
    </div>
  </div>
</div>

<!-- Client Modal -->
<div id="client-modal" class="overlay" style="display:none;" onclick="if(event.target===this)closeClientModal()">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:16px;font-weight:600;color:#003865;">載入客戶</div>
      <button onclick="closeClientModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9a8a78;">×</button>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:#ede6d8;border-radius:8px;padding:8px 12px;margin-bottom:12px;">
      <span style="color:#9a8a78;">🔍</span>
      <input id="cm-search" oninput="renderCM()" placeholder="搜尋客戶名稱..." style="border:none;background:transparent;font-size:14px;flex:1;outline:none;">
    </div>
    <div id="cm-list" style="max-height:300px;overflow-y:auto;margin-bottom:16px;"></div>
    <div style="display:flex;justify-content:flex-end;">
      <button onclick="closeClientModal()" style="padding:10px 18px;background:#fff;color:#6a5a48;border:1px solid #d8cfc0;border-radius:8px;font-size:14px;cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Main App -->
<div id="main-app" style="display:none;">
  <div id="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:1px;height:18px;background:rgba(255,255,255,.2);"></div>
      <div>
        <div style="color:#fff;font-size:15px;font-weight:700;line-height:1.1;">Lily Lau <span style="font-size:10px;opacity:.55;font-weight:400;">@pru_lilylau</span></div>
        <div style="color:rgba(255,255,255,.5);font-size:10px;margin-top:1px;">保單管理工具</div>
      </div>
    </div>
    <div style="display:flex;gap:6px;">
      <button class="tbtn" onclick="openCM()">📂 載入</button>
      <button class="tbtn" onclick="saveGist()">💾 儲存</button>
      <button class="tbtn primary" onclick="doPrint()">🖨 PDF</button>
      <button class="tbtn" onclick="openTransfer()">📲 轉移</button>
      <button class="tbtn" onclick="resetApp()">⚙</button>
    </div>
  </div>
  <div class="red-stripe"></div>

  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <button id="sb-toggle" onclick="toggleSb()" title="收起/展開">‹</button>
      <div id="sb-full">
        <div class="sb-title">客戶列表</div>
        <div class="sb-search"><span style="color:#9a8a78;font-size:12px;">🔍</span><input id="sb-q" oninput="renderSB()" placeholder="搜尋客戶..."></div>
        <div id="sb-list"></div>
        <button class="sb-new" onclick="newClient()">+ 新增客戶</button>
      </div>
      <div id="sb-collapsed">
        <button title="新增客戶" onclick="newClient()" style="width:32px;height:32px;border-radius:50%;background:none;border:1.5px dashed #E31837;color:#E31837;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;">+</button>
        <div id="sb-av-list"></div>
      </div>
    </div>

    <!-- Content -->
    <div id="content">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
        <div id="ed-title" style="font-size:20px;font-weight:700;color:#003865;">新客戶</div>
        <button onclick="saveGist()" style="padding:10px 18px;background:#fff;color:#6a5a48;border:1px solid #d8cfc0;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;">💾 儲存至 GitHub</button>
      </div>

      <!-- Report info -->
      <div class="sec-card">
        <div class="sec-title">報告資料</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
          <div class="ff"><label class="fl">客戶 / 家庭稱號</label><input class="fi" id="f-fname" placeholder="陳氏家庭 / 陳大文"></div>
          <div class="ff" style="min-width:0;"><label class="fl">報告日期</label><input class="fi" type="date" id="f-rdate"></div>
         </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;">
          <div class="ff"><label class="fl">顧問姓名</label><input class="fi" id="f-adv" placeholder="Lily Lau"></div>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <span style="font-size:11px;font-weight:600;color:#6a5a48;text-transform:uppercase;letter-spacing:.05em;">客戶類型：</span>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;color:#003865;">
            <input type="radio" name="ct" value="family" id="ct-fam" onchange="onCTChange()"> 👨‍👩‍👧 家庭客
          </label>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:500;color:#003865;">
            <input type="radio" name="ct" value="single" id="ct-sin" onchange="onCTChange()"> 👤 單身客
          </label>
        </div>
      </div>

      <div id="members-wrap"></div>
      <button class="add-member-btn" id="add-mb-btn" onclick="addMember()">+ 新增家庭成員</button>

      <div class="sec-card">
        <div class="sec-title">顧問備註</div>
        <textarea class="fi" id="f-remarks" rows="3" placeholder="例：建議陳先生加強醫療保障..."></textarea>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CONSTANTS ───────────────────────────────────────────────────────────────
const RED='#E31837',NAVY='#003865',MILK='#A08060';
const AVBG=['#003865','#E31837','#276B0C','#7A4500','#3A2F8F','#085041'];
const FX={HKD:1,USD:7.78,RMB:1.07,CNY:1.07,GBP:9.85,EUR:8.30};
const toHKD=(a,c)=>{const r=FX[c]||0;return r?Math.round(a*r):null;};
const fmt=n=>Math.round(n).toLocaleString('zh-HK');
const fmtP=(n,c)=>{if(!n)return'—';const r=parseFloat(String(n).replace(/,/g,''));if(isNaN(r))return String(n);const f=fmt(r);if(c&&c!=='HKD'&&FX[c])return`${c} ${f} (≈ HKD ${fmt(toHKD(r,c))})`;return`${c?c+' ':''}${f}`.trim();};
const fD=v=>{if(!v)return'—';const d=new Date(v);if(isNaN(d))return v;return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;};
const getAge=dob=>{if(!dob)return'';const d=new Date(dob),n=new Date();const a=n.getFullYear()-d.getFullYear()-(n<new Date(n.getFullYear(),d.getMonth(),d.getDate())?1:0);return`${a}歲`;};
const ac=v=>{const r=String(v).replace(/,/g,'');const n=parseFloat(r);return(!isNaN(n)&&r!=='')?n.toLocaleString('zh-HK'):v;};
const TYPE_ZH={savings:'儲蓄',critical:'危疾',medical:'醫療',life:'人壽',annuity:'年金',fund:'基金',general:'一般保險'};

// ─── TOAST ────────────────────────────────────────────────────────────────────
function toast(msg,type=''){
  clearTimeout(toastTimer);
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type||'');
  toastTimer=setTimeout(()=>{el.className='';},2800);
}

// ─── PIN ──────────────────────────────────────────────────────────────────────
let pinVal='';
function pinKey(k){
  if(pinVal.length>=4)return;
  pinVal+=k;renderPinDots();
  if(pinVal.length===4){setTimeout(()=>{
    const stored=gP();
    if(!stored){pinVal='';renderPinDots();showSetup();return;}
    if(pinVal===stored){enterApp();}
    else{document.getElementById('pin-err').textContent='PIN 碼錯誤，請重試';pinVal='';renderPinDots();setTimeout(()=>{document.getElementById('pin-err').textContent='';},2000);}
  },200);}
}
function pinDel(){pinVal=pinVal.slice(0,-1);renderPinDots();}
function renderPinDots(){for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);d.textContent=i<pinVal.length?'●':'·';d.classList.toggle('filled',i<pinVal.length);}}

// ─── SETUP ────────────────────────────────────────────────────────────────────
function showSetup(){document.getElementById('pin-screen').style.display='none';document.getElementById('setup-modal').classList.add('show');}
function setupVerify(){const t=document.getElementById('setup-tok').value.trim();if(!t)return;try{localStorage.setItem('pru_gh_token',t);}catch(e){}document.getElementById('setup-status').textContent='✓ Token 已儲存';document.getElementById('setup-status').style.color='#276B0C';}
function setupSave(){const t=document.getElementById('setup-tok').value.trim()||gT(),p=document.getElementById('setup-pin').value;if(!t){alert('請輸入 GitHub Token');return;}if(p.length!==4||!/^\d+$/.test(p)){alert('請輸入4位數字PIN碼');return;}try{localStorage.setItem('pru_gh_token',t);localStorage.setItem('pru_pin',p);}catch(e){alert('儲存設定失敗');return;}document.getElementById('setup-modal').classList.remove('show');enterApp();}

// ─── ENTER APP ────────────────────────────────────────────────────────────────
function enterApp(){document.getElementById('pin-screen').style.display='none';document.getElementById('setup-modal').classList.remove('show');document.getElementById('main-app').style.display='block';loadGists();loadForm();}
function resetApp(){if(!confirm('確定要重置所有設定？'))return;try{localStorage.removeItem('pru_pin');localStorage.removeItem('pru_gh_token');}catch(e){}location.reload();}

function doImport(){const s=document.getElementById('im-str').value.trim();document.getElementById('im-err').textContent='';try{const d=JSON.parse(decodeURIComponent(escape(atob(s))));if(!d.t||!d.p)throw new Error();localStorage.setItem('pru_gh_token',d.t);localStorage.setItem('pru_pin',d.p);document.getElementById('tr-im').innerHTML='<div style="text-align:center;padding:24px;"><div style="font-size:32px;margin-bottom:12px;">✅</div><div style="font-size:15px;font-weight:600;color:#276B0C;margin-bottom:16px;">設定已成功匯入！</div><button onclick="location.reload()" style="padding:10px 24px;background:#003865;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;">立即重新載入</button></div>';}catch(e){document.getElementById('im-err').textContent='無效的轉移碼，請重試';}}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function toggleSb(){sbOpen=!sbOpen;document.getElementById('app').classList.toggle('collapsed',!sbOpen);document.getElementById('sb-toggle').textContent=sbOpen?'‹':'›';}
function renderSB(){const q=(document.getElementById('sb-q').value||'').toLowerCase();const list=document.getElementById('sb-list');const avList=document.getElementById('sb-av-list');const filtered=allGists.filter(g=>g.description.toLowerCase().includes(q));if(!filtered.length){list.innerHTML='<div style="padding:20px 16px;text-align:center;color:#9a8a78;font-size:12px;line-height:1.7;">尚未有客戶記錄</div>';avList.innerHTML='';return;}list.innerHTML=filtered.map((g,i)=>{const nm=g.description.replace('PRU_CLIENT:','');const dt=new Date(g.updated_at).toLocaleDateString('zh-HK');return`<div class="sb-item${curGist===g.id?' active':''}" id="sbi-${g.id}"><div class="sb-avatar" style="background:${AVBG[i%6]};" onclick="loadGist('${g.id}')">${nm.charAt(0)}</div><div style="flex:1;min-width:0;" onclick="loadGist('${g.id}')"><div style="font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${nm}</div><div style="font-size:11px;color:#9a8a78;margin-top:1px;">${dt}</div></div><button onclick="delGist('${g.id}','${nm.replace(/'/g,"\\'")}')" style="background:none;border:none;cursor:pointer;color:#9a8a78;font-size:16px;padding:2px 4px;">×</button></div>`;}).join('');avList.innerHTML=filtered.map((g,i)=>{const nm=g.description.replace('PRU_CLIENT:','');return`<div title="${nm}" onclick="loadGist('${g.id}');if(!sbOpen)toggleSb();" style="width:32px;height:32px;border-radius:50%;background:${AVBG[i%6]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;border:${curGist===g.id?'2px solid #003865':'2px solid transparent'};">${nm.charAt(0)}</div>`;}).join('');}

// ─── GITHUB GIST ─────────────────────────────────────────────────────────────
async function loadGists(){const tok=gT();if(!tok)return;try{const r=await fetch('https://api.github.com/gists?per_page=100',{headers:{Authorization:'token '+tok}});const d=await r.json();allGists=(Array.isArray(d)?d:[]).filter(g=>g.description?.startsWith('PRU_CLIENT:'));renderSB();}catch(e){console.error(e);}}
async function loadGist(id){const tok=gT();try{const r=await fetch(`https://api.github.com/gists/${id}`,{headers:{Authorization:'token '+tok}});const g=await r.json();const file=Object.values(g.files)[0];const d=JSON.parse(file.content);curGist=id;S={...d,members:d.members?.length?d.members:[newMember()]};loadForm();renderSB();toast('已載入：'+d.fname,'ok');}catch(e){toast('載入失敗','err');}}
async function saveGist(){const tok=gT();if(!tok){toast('未設定 Token','err');return;}collectState();const nm=S.fname||'未命名客戶',body=JSON.stringify(S,null,2);try{let method='POST',url='https://api.github.com/gists';if(curGist){method='PATCH';url=`https://api.github.com/gists/${curGist}`;}else{const ex=allGists.find(g=>g.description==='PRU_CLIENT:'+nm);if(ex){curGist=ex.id;method='PATCH';url=`https://api.github.com/gists/${ex.id}`;}}const r=await fetch(url,{method,headers:{Authorization:'token '+tok,'Content-Type':'application/json'},body:JSON.stringify({description:'PRU_CLIENT:'+nm,public:false,files:{'client.json':{content:body}}})});const g=await r.json();curGist=g.id;await loadGists();toast('已儲存：'+nm,'ok');}catch(e){toast('儲存失敗','err');}}
async function delGist(id,nm){if(!confirm(`確定要刪除「${nm}」的記錄嗎？`))return;const tok=gT();try{const r=await fetch(`https://api.github.com/gists/${id}`,{method:'DELETE',headers:{Authorization:'token '+tok}});if(r.status===204){allGists=allGists.filter(g=>g.id!==id);if(curGist===id){curGist=null;newClient();}renderSB();toast('已刪除「'+nm+'」','ok');}else toast('刪除失敗','err');}catch(e){toast('刪除失敗','err');}}

function renderCM(){const q=(document.getElementById('cm-search').value||'').toLowerCase();const filtered=allGists.filter(g=>g.description.toLowerCase().includes(q));const list=document.getElementById('cm-list');if(!filtered.length){list.innerHTML='<div style="text-align:center;color:#9a8a78;font-size:13px;padding:24px;">未有客戶記錄</div>';return;}list.innerHTML=filtered.map((g,i)=>{const nm=g.description.replace('PRU_CLIENT:','');const dt=new Date(g.updated_at).toLocaleDateString('zh-HK');return`<div style="padding:10px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px;" onmouseover="this.style.background='#EAF1F8'" onmouseout="this.style.background=''" onclick="loadGist('${g.id}');closeClientModal()"><div style="width:32px;height:32px;border-radius:50%;background:${AVBG[i%6]};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">${nm.charAt(0)}</div><div><div style="font-size:14px;font-weight:500;">${nm}</div><div style="font-size:11px;color:#9a8a78;">上次更新：${dt}</div></div></div>`;}).join('');}

function newClient(){curGist=null;S={fname:'',rdate:new Date().toISOString().split('T')[0],adv:'',remarks:'',clientType:'family',members:[newMember()]};loadForm();renderSB();}
function loadForm(){document.getElementById('f-fname').value=S.fname||'';document.getElementById('f-rdate').value=S.rdate||new Date().toISOString().split('T')[0];document.getElementById('f-adv').value=S.adv||'';document.getElementById('f-remarks').value=S.remarks||'';document.getElementById('ct-fam').checked=S.clientType!=='single';document.getElementById('ct-sin').checked=S.clientType==='single';document.getElementById('ed-title').textContent=S.fname||'新客戶';updateAddBtn();renderMembers();}
function onCTChange(){collectState();S.clientType=document.querySelector('input[name="ct"]:checked')?.value||'family';updateAddBtn();renderMembers();}
function updateAddBtn(){document.getElementById('add-mb-btn').textContent=`+ 新增${S.clientType==='single'?'保單持有人':'家庭成員'}`;}
function collectState(){S.fname=document.getElementById('f-fname').value;S.rdate=document.getElementById('f-rdate').value;S.adv=document.getElementById('f-adv').value;S.remarks=document.getElementById('f-remarks').value;S.clientType=document.querySelector('input[name="ct"]:checked')?.value||'family';S.members=collectMembers();}
function collectMembers(){return Array.from(document.querySelectorAll('.mc')).map(mel=>{const g=f=>mel.querySelector(`[data-f="${f}"]`)?.value||'';return{name:g('name'),dob:g('dob'),role:g('role'),owner:g('owner'),insured:g('insured'),beneficiary:g('beneficiary'),smoke:g('smoke'),policies:collectPolicies(mel)};});}
function collectPolicies(mel){return Array.from(mel.querySelectorAll('.pc')).map(pel=>{const g=f=>pel.querySelector(`[data-f="${f}"]`)?.value||'';const planName=g('planName');const isCustom=planName.includes('自行輸入');return{type:g('type'),planName:isCustom?g('customName'):planName,policyNo:g('policyNo'),mode:g('mode'),currency:g('currency'),premium:g('premium'),sumAssured:g('sumAssured'),effectiveDate:g('effectiveDate'),paymentTerm:g('paymentTerm'),nextReview:g('nextReview'),ward:g('ward'),deductible:g('deductible'),annualLimit:g('annualLimit'),lifetimeLimit:g('lifetimeLimit'),accMed:g('accMed'),accDeath:g('accDeath'),accDisable:g('accDisable'),sv65:g('sv65'),sv75:g('sv75'),svcur:g('svcur')||'HKD',critDis:g('critDis'),critExtra:g('critExtra'),crit65:g('crit65'),crit75:g('crit75'),critSvc:g('critSvc')||'HKD',lifeTo:g('lifeTo'),life65:g('life65'),life75:g('life75'),lifeSvc:g('lifeSvc')||'HKD'};})}

// ─── RENDER MEMBERS ───────────────────────────────────────────────────────────
function addMember(){collectState();S.members.push(newMember());renderMembers();}
function removeMember(i){collectState();S.members.splice(i,1);if(!S.members.length)S.members=[newMember()];renderMembers();}
function addPolicy(mi){collectState();S.members[mi].policies.push(newPolicy());renderMembers();}
function removePolicy(mi,pi){collectState();S.members[mi].policies.splice(pi,1);renderMembers();}
function onTypeChange(sel,mi,pi){collectState();S.members[mi].policies[pi].type=sel.value;S.members[mi].policies[pi].planName=PRODS[sel.value]?.[0]||'';renderMembers();}
function onPlanChange(sel){const isCustom=sel.value.includes('自行輸入');const pc=sel.closest('.pc');const ex=pc.querySelector('[data-f="customName"]');if(isCustom&&!ex){const inp=document.createElement('input');inp.className='fi';inp.dataset.f='customName';inp.placeholder='自行輸入計劃名稱';inp.style.marginTop='6px';sel.parentNode.appendChild(inp);}else if(!isCustom&&ex)ex.remove();}
function onWardChange(sel){const pc=sel.closest('.pc');const planName=pc.querySelector('[data-f="planName"]')?.value;const mdata=MDATA[planName];if(mdata){const al=pc.querySelector('[data-f="annualLimit"]');const ll=pc.querySelector('[data-f="lifetimeLimit"]');if(al&&mdata.annualLimits?.[sel.value])al.value=mdata.annualLimits[sel.value];if(ll&&mdata.lifetimeLimit)ll.value=mdata.lifetimeLimit;}}
function onMedPlanChange(sel){const pc=sel.closest('.pc');const planName=sel.value;const mdata=MDATA[planName];if(!mdata)return;const ward=pc.querySelector('[data-f="ward"]');const ded=pc.querySelector('[data-f="deductible"]');const al=pc.querySelector('[data-f="annualLimit"]');const ll=pc.querySelector('[data-f="lifetimeLimit"]');const notesEl=pc.querySelector('.med-notes');if(ward){ward.innerHTML='<option value="">選擇病房</option>'+(mdata.wards||[]).map(w=>`<option>${w}</option>`).join('')+'<option value="自行輸入">自行輸入</option>';}if(ded){ded.innerHTML='<option value="">選擇自付額</option>'+(mdata.deductibles||[]).map(d=>`<option>${d}</option>`).join('')+'<option value="自行輸入">自行輸入</option>';}if(ll&&mdata.lifetimeLimit)ll.value=mdata.lifetimeLimit;if(notesEl)notesEl.textContent=mdata.notes?('💡 '+mdata.notes):'';}

function renderMembers(){const wrap=document.getElementById('members-wrap');const isSingle=S.clientType==='single';wrap.innerHTML='';S.members.forEach((m,mi)=>{const col=AVBG[mi%6];const roles=isSingle?ROLES_SIN:ROLES_FAM;const div=document.createElement('div');div.className='mc';div.innerHTML=`
<div class="mc-hdr">
  <div class="mc-av" style="background:${col};">${m.name?m.name.charAt(0):'家'}</div>
  <div style="flex:1;"><div style="color:#fff;font-size:15px;font-weight:600;">${m.name||'新成員'}${!isSingle&&m.role?`<span style="font-size:11px;opacity:.65;font-weight:400;"> · ${m.role.split('/')[0]}</span>`:''}  </div></div>
  <button onclick="removeMember(${mi})" style="background:none;border:none;cursor:pointer;color:rgba(255,255,255,.4);font-size:20px;padding:0;">×</button>
</div>
<div class="mc-body">
  ${isSingle?`
  <div class="g2" style="margin-bottom:12px;">
    <div class="ff"><label class="fl">姓名</label><input class="fi" data-f="name" value="${m.name||''}" oninput="this.closest('.mc').querySelector('.mc-av').textContent=this.value?this.value.charAt(0):'家';this.closest('.mc').querySelectorAll('.mc-hdr div')[1].querySelector('div').childNodes[0].textContent=this.value||'新成員'"></div>
    <div class="ff"><label class="fl">出生日期</label><input class="fi" type="date" data-f="dob" value="${m.dob||''}"></div>
    </div>
<div class="g2" style="margin-bottom:12px;">
    <div class="ff"><label class="fl">吸煙</label><select class="fi" data-f="smoke"><option value="NS"${m.smoke!=='S'?' selected':''}>非吸煙</option><option value="S"${m.smoke==='S'?' selected':''}>吸煙</option></select></div>
  </div>
  <div class="g3" style="margin-bottom:14px;">
    <div class="ff"><label class="fl">投保人</label><input class="fi" data-f="owner" value="${m.owner||''}" placeholder="本人"></div>
    <div class="ff"><label class="fl">受保人</label><input class="fi" data-f="insured" value="${m.insured||''}" placeholder="本人"></div>
    <div class="ff"><label class="fl">受益人</label><input class="fi" data-f="beneficiary" value="${m.beneficiary||''}" placeholder="配偶/父母/子女"></div>
  </div>`:`
  <div class="g2" style="margin-bottom:12px;">
    <div class="ff"><label class="fl">姓名</label><input class="fi" data-f="name" value="${m.name||''}" oninput="this.closest('.mc').querySelector('.mc-av').textContent=this.value?this.value.charAt(0):'家'"></div>
    <div class="ff"><label class="fl">出生日期</label><input class="fi" type="date" data-f="dob" value="${m.dob||''}"></div>
    </div>
<div class="g2" style="margin-bottom:12px;"
    <div class="ff"><label class="fl">身份</label><select class="fi" data-f="role">${roles.map(r=>`<option${m.role===r?' selected':''}>${r}</option>`).join('')}</select></div>
  </div>
  <div class="g2" style="margin-bottom:14px;">
    <div class="g2">
      <div class="ff"><label class="fl">投保人</label><input class="fi" data-f="owner" value="${m.owner||''}" placeholder="本人"></div>
      <div class="ff"><label class="fl">受保人</label><input class="fi" data-f="insured" value="${m.insured||''}" placeholder="本人"></div>
    </div>
    <div class="g2">
      <div class="ff"><label class="fl">受益人</label><input class="fi" data-f="beneficiary" value="${m.beneficiary||''}" placeholder="配偶/子女"></div>
      <div class="ff"><label class="fl">吸煙</label><select class="fi" data-f="smoke"><option value="NS"${m.smoke!=='S'?' selected':''}>非吸煙</option><option value="S"${m.smoke==='S'?' selected':''}>吸煙</option></select></div>
    </div>
  </div>`}
  <div style="font-size:10px;font-weight:700;color:#003865;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;padding-left:8px;border-left:2px solid #E31837;">保單</div>
  <div class="pc-wrap">${m.policies.map((p,pi)=>buildPolicyHTML(p,mi,pi)).join('')}</div>
  <button class="add-policy-btn" onclick="addPolicy(${mi})">+ 新增保單</button>
</div>`;
  wrap.appendChild(div);});
}

function buildPolicyHTML(p,mi,pi){
  const t=p.type||'medical';const prods=PRODS[t]||[];const isCustom=(p.planName||'').includes('自行輸入');
  const mdata=MDATA[p.planName]||null;
  const svCol={savings:'#276B0C',annuity:'#085041',critical:'#C0392B',life:'#5B4A8A'};
  const svBrd={savings:'#c0dd97',annuity:'#5DCAA5',critical:'#f5c0c9',life:'#b4a8d8'};
  const sc=svCol[t]||'#276B0C',sb=svBrd[t]||'#c0dd97';
  const exBg={medical:'background:#EAF1F8;border:1px solid #b5d4f4',savings:'background:#EDF5E6;border:1px solid #c0dd97',annuity:'background:#E1F5EE;border:1px solid #5DCAA5',critical:'background:#fdf0ef;border:0.5px solid #e8b4b0',life:'background:#f0eef8;border:0.5px solid #b4a8d8',general:'background:#F1EFE8;border:1px solid #b4b2a9'};
  const exTitleC={medical:'color:#003865;border-color:#003865',savings:'color:#276B0C;border-color:#276B0C',annuity:'color:#085041;border-color:#085041',critical:'color:#C0392B;border-color:#C0392B',life:'color:#5B4A8A;border-color:#5B4A8A'};

  let extraHTML='';
  if(t==='medical'){
    const wards=mdata?.wards||['私家病房','半私家病房','普通病房'];
    const deds=mdata?.deductibles||['不設自付額'];
    extraHTML=`<div class="extra-box" style="${exBg.medical||''}">
      <span class="extra-title" style="${exTitleC.medical||''}">醫療保障詳情</span>
      ${mdata?.notes?`<div style="font-size:11px;color:#003865;background:rgba(255,255,255,.6);border-radius:5px;padding:5px 8px;margin-bottom:10px;line-height:1.5;" class="med-notes">💡 ${mdata.notes}</div>`:'<div class="med-notes" style="display:none;"></div>'}
      <div class="g2" style="margin-bottom:10px;">
        <div class="ff"><label class="fl">病房級別</label>
          <select class="fi" data-f="ward" onchange="onWardChange(this)">
            <option value="">選擇病房</option>
            ${wards.map(w=>`<option${p.ward===w?' selected':''}>${w}</option>`).join('')}
            <option value="自行輸入"${p.ward==='自行輸入'?' selected':''}>自行輸入</option>
          </select>
        </div>
        <div class="ff"><label class="fl">自付額</label>
          <select class="fi" data-f="deductible">
            <option value="">選擇自付額</option>
            ${deds.map(d=>`<option${p.deductible===d?' selected':''}>${d}</option>`).join('')}
            <option value="自行輸入"${p.deductible==='自行輸入'?' selected':''}>自行輸入</option>
          </select>
        </div>
      </div>
      <div class="g2">
        <div class="ff"><label class="fl">每年保額</label><input class="fi" data-f="annualLimit" value="${p.annualLimit||''}" placeholder="${mdata?.annualLimits?.[p.ward]||'按計劃'}"></div>
        <div class="ff"><label class="fl">終生保額</label><input class="fi" data-f="lifetimeLimit" value="${p.lifetimeLimit||''}" placeholder="${mdata?.lifetimeLimit||'不設上限'}"></div>
      </div>
    </div>`;}
  else if(t==='accident'){extraHTML=`<div class="extra-box" style="background:#FEF7EC;border:1px solid #fac775">
    <span class="extra-title" style="color:#7A4500;border-color:#EF9F27">意外保障詳情</span>
    <div class="g3">
      <div class="ff"><label class="fl">意外醫療保額</label><input class="fi" data-f="accMed" value="${p.accMed||''}" placeholder="100,000"></div>
      <div class="ff"><label class="fl">意外身故保額</label><input class="fi" data-f="accDeath" value="${p.accDeath||''}" placeholder="500,000"></div>
      <div class="ff"><label class="fl">永久傷殘保額</label><input class="fi" data-f="accDisable" value="${p.accDisable||''}" placeholder="500,000"></div>
    </div></div>`;}
  else if(t==='savings'||t==='annuity'){extraHTML=`<div class="extra-box" style="${exBg[t]||exBg.savings}">
    <span class="extra-title" style="${exTitleC[t]||exTitleC.savings}">退保價值</span>
    <div style="display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end;">
      <div class="ff"><label class="fl">貨幣</label><select class="fi" data-f="svcur" style="font-size:13px;">${CURRENCIES.map(c=>`<option${(p.svcur||'HKD')===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">65歲退保價值</div><input data-f="sv65" value="${p.sv65||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">75歲退保價值</div><input data-f="sv75" value="${p.sv75||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
    </div></div>`;}
  else if(t==='critical'){extraHTML=`<div class="extra-box" style="${exBg.critical}">
    <span class="extra-title" style="${exTitleC.critical}">危疾保障詳情</span>
    <div class="g2" style="margin-bottom:10px;">
      <div class="ff"><label class="fl">保障疾病數目</label><input class="fi" data-f="critDis" value="${p.critDis||''}" placeholder="例：128種"></div>
      <div class="ff"><label class="fl">頭10年額外保額 (%)</label><input class="fi" data-f="critExtra" value="${p.critExtra||''}" placeholder="例：100"></div>
    </div>
    <div style="display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end;">
      <div class="ff"><label class="fl">貨幣</label><select class="fi" data-f="critSvc" style="font-size:13px;">${CURRENCIES.map(c=>`<option${(p.critSvc||'HKD')===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">65歲退保價值</div><input data-f="crit65" value="${p.crit65||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">75歲退保價值</div><input data-f="crit75" value="${p.crit75||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
    </div></div>`;}
  else if(t==='life'){extraHTML=`<div class="extra-box" style="${exBg.life}">
    <span class="extra-title" style="${exTitleC.life}">人壽保障詳情</span>
    <div class="g2" style="margin-bottom:10px;">
      <div class="ff"><label class="fl">保障至</label><input class="fi" data-f="lifeTo" value="${p.lifeTo||''}" placeholder="例：100歲 / 終身"></div>
      <div></div>
    </div>
    <div style="display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:end;">
      <div class="ff"><label class="fl">貨幣</label><select class="fi" data-f="lifeSvc" style="font-size:13px;">${CURRENCIES.map(c=>`<option${(p.lifeSvc||'HKD')===c?' selected':''}>${c}</option>`).join('')}</select></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">65歲退保價值</div><input data-f="life65" value="${p.life65||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
      <div style="background:#fff;border:1px solid ${sb};border-radius:6px;padding:7px 10px;text-align:center;"><div style="font-size:10px;color:${sc};margin-bottom:3px;font-weight:600;">75歲退保價值</div><input data-f="life75" value="${p.life75||''}" placeholder="000,000" style="border:none;background:transparent;font-size:13px;font-weight:600;text-align:center;width:100%;padding:0;font-family:monospace;color:${sc};outline:none;"></div>
    </div></div>`;}

  return`<div class="pc" data-mi="${mi}" data-pi="${pi}">
  <div class="pc-toprow">
    <select class="type-sel" data-f="type" onchange="onTypeChange(this,${mi},${pi})">${Object.entries(TYPE_ZH).map(([v,l])=>`<option value="${v}"${t===v?' selected':''}>${l}</option>`).join('')}</select>
    <button onclick="removePolicy(${mi},${pi})" style="background:none;border:none;cursor:pointer;color:#9a8a78;font-size:18px;border-radius:50%;width:28px;height:28px;">×</button>
  </div>
  <div class="g2" style="margin-bottom:12px;">
    <div class="ff"><label class="fl">計劃名稱</label>
      <select class="fi" data-f="planName" style="font-size:13px;" onchange="onPlanChange(this);if(this.closest('.pc').querySelector('[data-f=\\'type\\']').value==='medical')onMedPlanChange(this)">
        ${prods.map(n=>`<option${(p.planName||prods[0])===n?' selected':''}>${n}</option>`).join('')}
      </select>
      ${isCustom?`<input class="fi" data-f="customName" value="${p.customName||p.planName||''}" placeholder="自行輸入計劃名稱" style="margin-top:6px;">`:''}
    </div>
    <div class="ff"><label class="fl">保單號碼</label><input class="fi" data-f="policyNo" value="${p.policyNo||''}" placeholder="12345678"></div>
  </div>
  <div class="g2" style="margin-bottom:12px;">
    <div class="g2">
      <div class="ff"><label class="fl">繳費</label><select class="fi" data-f="mode" style="font-size:13px;">${MODES.map(m=>`<option value="${m.v}"${(p.mode||'annual')===m.v?' selected':''}>${m.l}</option>`).join('')}</select></div>
      <div class="ff"><label class="fl">貨幣</label><select class="fi" data-f="currency" style="font-size:13px;">${CURRENCIES.map(c=>`<option${(p.currency||'HKD')===c?' selected':''}>${c}</option>`).join('')}</select></div>
    </div>
    <div class="g2">
      <div class="ff"><label class="fl">保費</label><input class="fi" data-f="premium" value="${p.premium||''}" placeholder="5,000" style="font-size:13px;" oninput="this.value=ac(this.value)"></div>
      <div class="ff"><label class="fl">保額</label><input class="fi" data-f="sumAssured" value="${p.sumAssured||''}" placeholder="1,000,000" style="font-size:13px;" oninput="this.value=ac(this.value)"></div>
    </div>
  </div>
  <div class="g2" style="margin-bottom:12px;">
    <div class="ff"><label class="fl">生效日期</label><input class="fi" type="date" data-f="effectiveDate" value="${p.effectiveDate||''}" style="font-size:13px;"></div>
    <div class="ff"><label class="fl">繳費年期</label><input class="fi" data-f="paymentTerm" value="${p.paymentTerm||''}" placeholder="20年"></div>
    </div>
   <div style="margin-bottom:12px;">
    <div class="ff"><label class="fl">下次檢視</label><input class="fi" type="date" data-f="nextReview" value="${p.nextReview||''}" style="font-size:13px;"></div>
  </div>
  ${extraHTML}
</div>`;}

// ─── PIE CHART ────────────────────────────────────────────────────────────────
function buildPieData(members){const tm={};let total=0;(members||[]).forEach(m=>(m.policies||[]).forEach(p=>{const raw=parseFloat((p.premium||'0').replace(/,/g,''));if(isNaN(raw)||raw<=0)return;const a=p.mode==='monthly'?raw*12:p.mode==='quarterly'?raw*4:raw;const h=p.currency==='HKD'?a:(toHKD(a,p.currency)||a);tm[p.type]=(tm[p.type]||0)+h;total+=h;}));const pd=Object.entries(tm).sort((a,b)=>b[1]-a[1]).map(([t,v])=>({type:t,val:v,color:WCOL[t]||'#999'}));return{pieData:pd,grandHKD:total,typeMap:tm};}
function buildPieSVG(pieData,size){const cx=size/2,cy=size/2,r=size*0.42,inner=size*0.22,midR=(r+inner)/2;const total=pieData.reduce((s,d)=>s+d.val,0);if(!total)return`<svg width="${size}" height="${size}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#e8e2d8"/><circle cx="${cx}" cy="${cy}" r="${inner}" fill="#faf7f2"/></svg>`;const polar=(r2,a)=>[cx+r2*Math.cos(a),cy+r2*Math.sin(a)];const arc=(s,e,or,ir)=>{const[x1,y1]=polar(or,s),[x2,y2]=polar(or,e),[x3,y3]=polar(ir,e),[x4,y4]=polar(ir,s);const lg=(e-s)>Math.PI?1:0;return`M${x1},${y1} A${or},${or} 0 ${lg},1 ${x2},${y2} L${x3},${y3} A${ir},${ir} 0 ${lg},0 ${x4},${y4} Z`;};let start=-Math.PI/2,paths='',labels='';const gap=0.022;pieData.forEach(d=>{const sw=(d.val/total)*Math.PI*2-gap,end=start+sw;paths+=`<path d="${arc(start,end,r,inner)}" fill="${d.color}" stroke="#fff" stroke-width="2"/>`;const pct=Math.round(d.val/total*100);if(pct>=5){const mid=start+sw/2,[lx,ly]=polar(midR,mid);const showZh=pct>=14,zh=TYPE_MAP[d.type]||d.type;const yp=showZh?ly-size*0.022:ly;labels+=`<text x="${lx}" y="${yp}" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="${Math.round(size*0.048)}" font-weight="700" fill="#fff" filter="url(#ts)">${pct}%</text>`;if(showZh)labels+=`<text x="${lx}" y="${ly+size*0.038}" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="${Math.round(size*0.036)}" fill="#fff" filter="url(#ts)">${zh}</text>`;}start+=sw+gap;});return`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg"><defs><filter id="ts" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="rgba(0,0,0,0.55)"/></filter></defs>${paths}<circle cx="${cx}" cy="${cy}" r="${inner}" fill="#faf7f2" stroke="#d4cdc4" stroke-width="1"/>${labels}<text x="${cx}" y="${cy-size*0.038}" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="${Math.round(size*0.066)}" font-weight="700" fill="#3a2a1a">保障</text><text x="${cx}" y="${cy+size*0.052}" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="${Math.round(size*0.054)}" fill="#3a2a1a">分佈</text></svg>`;}

// ─── PRINT ────────────────────────────────────────────────────────────────────
function doPrint(){
  collectState();
  const{fname='',rdate='',adv='',remarks='',clientType='family',members=[]}=S;
  const isSingle=clientType==='single';
  const subtitle=isSingle?`個人保單總覽 — ${fname}`:`家庭保單總覽 — ${fname}`;
  const totLabel=isSingle?'年度總保費':'全家年度總保費';
  const rdt=fD(rdate);
  const{pieData,grandHKD}=buildPieData(members);
  const pieSVG=buildPieSVG(pieData,190);

  // SA / SV
  const critSA={},lifeSA={};
  members.forEach(m=>(m.policies||[]).forEach(p=>{const raw=parseFloat((p.sumAssured||'0').replace(/,/g,''));if(isNaN(raw)||raw<=0)return;if(p.type==='critical'){const c=p.currency||'HKD';critSA[c]=(critSA[c]||0)+raw;lifeSA[c]=(lifeSA[c]||0)+raw;}if(p.type==='life'){const c=p.currency||'HKD';lifeSA[c]=(lifeSA[c]||0)+raw;}}));
  const fmtSA=m=>{const e=Object.entries(m);if(!e.length)return'—';const t=e.reduce((s,[c,a])=>s+(c==='HKD'?a:(toHKD(a,c)||a)),0);return`HKD ${fmt(t)}`;};
  let sv65=0,sv75=0,has65=false,has75=false;
  const toH=(n,c)=>{const r=parseFloat(String(n||'0').replace(/,/g,''));if(isNaN(r)||!r)return 0;return c==='HKD'?r:(toHKD(r,c)||r);};
  members.forEach(m=>(m.policies||[]).forEach(p=>{if(p.type==='savings'||p.type==='annuity'){if(p.sv65){sv65+=toH(p.sv65,p.svcur||'HKD');has65=true;}if(p.sv75){sv75+=toH(p.sv75,p.svcur||'HKD');has75=true;}}if(p.type==='critical'){const c=p.critSvc||p.currency||'HKD';if(p.crit65){sv65+=toH(p.crit65,c);has65=true;}if(p.crit75){sv75+=toH(p.crit75,c);has75=true;}}if(p.type==='life'){const c=p.lifeSvc||p.currency||'HKD';if(p.life65){sv65+=toH(p.life65,c);has65=true;}if(p.life75){sv75+=toH(p.life75,c);has75=true;}}}));

  // Members HTML
  let grand=0,grandCur=null;
  members.forEach(m=>(m.policies||[]).forEach(p=>{const raw=parseFloat((p.premium||'0').replace(/,/g,''));if(!isNaN(raw)&&raw>0){const a=p.mode==='monthly'?raw*12:p.mode==='quarterly'?raw*4:raw;if(!grandCur||grandCur===p.currency){grand+=a;grandCur=p.currency;}}}));

  let membersHTML='';
  members.forEach((m,mi)=>{
    let mTot=0,mCur=null;
    (m.policies||[]).forEach(p=>{const raw=parseFloat((p.premium||'0').replace(/,/g,''));if(!isNaN(raw)&&raw>0){const a=p.mode==='monthly'?raw*12:p.mode==='quarterly'?raw*4:raw;if(!mCur||mCur===p.currency){mTot+=a;mCur=p.currency;}}});
    const mTotHint=mTot>0&&mCur&&mCur!=='HKD'?` (≈HKD ${fmt(toHKD(mTot,mCur)||0)})`:'';
    const mTotStr=mTot>0&&mCur?`<div style="font-size:10px;color:rgba(255,255,255,.85);font-weight:600;text-align:right;white-space:nowrap;margin-left:auto;">年保費: ${mCur} ${fmt(mTot)}${mTotHint}</div>`:'';
    const age=getAge(m.dob),rel=m.role?m.role.split('/')[0]:'';
    const col=AVBG[mi%6];
    let polHTML='';
    (m.policies||[]).forEach(p=>{
      const bk=BADGE[p.type]||BADGE.life,tn=TYPE_ZH[p.type]||p.type;
      const prem=fmtP(p.premium,p.currency),sa=fmtP(p.sumAssured,p.currency);
      const modeL={annual:'年繳',monthly:'月繳',quarterly:'季繳'}[p.mode]||'';
      let ex='';
      if(p.type==='medical')ex=`<div style="margin-top:6px;background:#EAF1F8;border-radius:4px;padding:7px 9px;"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#003865;border-left:2px solid #003865;padding-left:5px;margin-bottom:5px;">醫療保障詳情</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;"><div class="ic"><div class="il">病房級別</div><div class="iv">${p.ward||'—'}</div></div><div class="ic"><div class="il">每年保額</div><div class="iv">${p.annualLimit||'—'}</div></div><div class="ic"><div class="il">終生保額</div><div class="iv">${p.lifetimeLimit||'—'}</div></div><div class="ic"><div class="il">自付額</div><div class="iv">${p.deductible||'—'}</div></div></div></div>`;
      else if(p.type==='accident')ex=`<div style="margin-top:6px;background:#FEF7EC;border-radius:4px;padding:7px 9px;"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#7A4500;border-left:2px solid #EF9F27;padding-left:5px;margin-bottom:5px;">意外保障詳情</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;"><div class="ic"><div class="il">意外醫療</div><div class="iv">${fmtP(p.accMed,p.currency)}</div></div><div class="ic"><div class="il">身故</div><div class="iv">${fmtP(p.accDeath,p.currency)}</div></div><div class="ic"><div class="il">永久傷殘</div><div class="iv">${fmtP(p.accDisable,p.currency)}</div></div></div></div>`;
      else if(p.type==='savings'||p.type==='annuity'){const sc2=p.type==='annuity'?{c:'#085041',b:'#5DCAA5'}:{c:'#276B0C',b:'#c0dd97'};if(p.sv65||p.sv75)ex=`<div style="margin-top:6px;background:#EDF5E6;border-radius:4px;padding:7px 9px;border:0.5px solid ${sc2.b};"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:${sc2.c};border-left:2px solid ${sc2.c};padding-left:5px;margin-bottom:5px;">退保價值</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid ${sc2.b};"><div style="font-size:9px;color:${sc2.c};margin-bottom:2px;">65歲退保價值</div><div style="font-size:12px;font-weight:700;color:${sc2.c};">${fmtP(p.sv65,p.svcur)}</div></div><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid ${sc2.b};"><div style="font-size:9px;color:${sc2.c};margin-bottom:2px;">75歲退保價值</div><div style="font-size:12px;font-weight:700;color:${sc2.c};">${fmtP(p.sv75,p.svcur)}</div></div></div></div>`;}
      else if(p.type==='critical'){const saR=parseFloat((p.sumAssured||'0').replace(/,/g,''));const exR=parseFloat(String(p.critExtra||'0').replace(/[,%\s]/g,''));const exD=exR>0?`${exR}%`:(p.critExtra||'—');let totD='—';if(!isNaN(exR)&&exR>0&&!isNaN(saR)&&saR>0){const tot=saR+saR*(exR/100);totD=`${p.currency} ${fmt(tot)}${p.currency!=='HKD'?` (≈HKD ${fmt(toHKD(tot,p.currency)||0)})`:''}`;} ex=`<div style="margin-top:6px;background:#FEF0F2;border-radius:4px;padding:7px 9px;border:0.5px solid #f5c0c9;"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#B5122B;border-left:2px solid #E31837;padding-left:5px;margin-bottom:5px;">危疾保障詳情</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:5px;"><div class="ic"><div class="il">保障疾病數目</div><div class="iv">${p.critDis||'—'}</div></div><div class="ic"><div class="il">頭10年額外保額</div><div class="iv">${exD}</div></div><div class="ic"><div class="il">頭10年總保額</div><div class="iv">${totD}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid #f5c0c9;"><div style="font-size:9px;color:#B5122B;margin-bottom:2px;">65歲退保價值</div><div style="font-size:12px;font-weight:700;color:#B5122B;">${fmtP(p.crit65,p.critSvc||p.currency)}</div></div><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid #f5c0c9;"><div style="font-size:9px;color:#B5122B;margin-bottom:2px;">75歲退保價值</div><div style="font-size:12px;font-weight:700;color:#B5122B;">${fmtP(p.crit75,p.critSvc||p.currency)}</div></div></div></div>`;}
      else if(p.type==='life')ex=`<div style="margin-top:6px;background:#F0EFF9;border-radius:4px;padding:7px 9px;border:0.5px solid #afa9ec;"><div style="font-size:9px;font-weight:700;text-transform:uppercase;color:#3A2F8F;border-left:2px solid #3A2F8F;padding-left:5px;margin-bottom:5px;">人壽保障詳情</div><div style="margin-bottom:5px;"><div class="ic"><div class="il">保障至</div><div class="iv">${p.lifeTo||'—'}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;"><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid #afa9ec;"><div style="font-size:9px;color:#3A2F8F;margin-bottom:2px;">65歲退保價值</div><div style="font-size:12px;font-weight:700;color:#3A2F8F;">${fmtP(p.life65,p.lifeSvc||p.currency)}</div></div><div style="background:#fff;border-radius:3px;padding:5px;text-align:center;border:0.5px solid #afa9ec;"><div style="font-size:9px;color:#3A2F8F;margin-bottom:2px;">75歲退保價值</div><div style="font-size:12px;font-weight:700;color:#3A2F8F;">${fmtP(p.life75,p.lifeSvc||p.currency)}</div></div></div></div>`;
      polHTML+=`<div style="border:0.5px solid #e2e6ea;border-radius:5px;overflow:hidden;margin-bottom:8px;"><div style="padding:7px 11px;background:#f8f9fa;border-bottom:0.5px solid #e2e6ea;display:flex;justify-content:space-between;"><div><span style="font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;border:0.5px solid;display:inline-block;margin-bottom:3px;background:${bk.bg};color:${bk.c};border-color:${bk.b};">${tn}</span><div style="font-size:12px;font-weight:700;">${p.planName||tn}</div>${p.policyNo?`<div style="font-size:9px;color:#6c757d;">保單號：${p.policyNo}</div>`:''}</div><div style="text-align:right;flex-shrink:0;"><div style="font-size:9px;color:#6c757d;">${modeL}</div><div style="font-size:12px;font-weight:700;">${prem}</div></div></div><div style="padding:7px 11px;background:#fff;"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;"><div class="ic"><div class="il">保額</div><div class="iv">${sa}</div></div><div class="ic"><div class="il">生效日</div><div class="iv">${fD(p.effectiveDate)}</div></div><div class="ic"><div class="il">繳費年期</div><div class="iv">${p.paymentTerm||'—'}</div></div></div>${ex}</div></div>`;
    });
    membersHTML+=`<div style="margin-bottom:14px;border:0.5px solid #dde2ea;border-radius:8px;overflow:hidden;"><div style="background:${NAVY};padding:9px 13px;display:flex;align-items:center;gap:9px;"><div style="width:32px;height:32px;border-radius:50%;background:${col};color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">${m.name?m.name.charAt(0):'?'}</div><div style="flex:1;"><div style="color:#fff;font-size:13px;font-weight:700;">${m.name||'（未填）'} <span style="font-size:10px;font-weight:400;opacity:.65;">${rel}${age?` · ${age}`:''}</span></div><div style="color:rgba(255,255,255,.55);font-size:9px;margin-top:1px;">投保人: ${m.owner||'—'} | 受保人: ${m.insured||'—'} | 受益人: ${m.beneficiary||'—'} | ${m.smoke==='NS'?'非吸煙':'吸煙'}</div></div>${mTotStr}</div><div style="padding:10px 12px;background:#fff;">${polHTML||'<div style="text-align:center;color:#aaa;font-size:12px;padding:1rem;">未有保單記錄</div>'}</div></div>`;
  });

  // Sidebar
  const legend=pieData.map(d=>`<span style="display:flex;align-items:center;gap:3px;font-size:10px;color:#52606d;"><span style="width:8px;height:8px;border-radius:50%;background:${d.color};display:inline-block;flex-shrink:0;"></span>${TYPE_MAP[d.type]||d.type}</span>`).join('');
  const distRows=pieData.map(d=>{const pct=grandHKD>0?Math.round(d.val/grandHKD*100):0;return`<tr><td style="padding:4px 8px 4px 0;"><span style="display:inline-block;background:${d.color};color:#fff;font-size:9px;font-weight:600;padding:2px 7px;border-radius:3px;min-width:48px;text-align:center;">${TYPE_MAP[d.type]||d.type}</span></td><td style="padding:4px 6px;text-align:right;font-size:10.5px;font-weight:600;color:#1a1a2e;">${fmt(d.val)}</td><td style="padding:4px 0;text-align:right;font-size:10px;color:#52606d;">${pct}%</td></tr>`;}).join('');

  // Watermark tiles
  let wm='';for(let i=0;i<80;i++)wm+=`<span>${i%2===0?'@pru_lilylau':'保誠保險'}</span>`;

  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${fname||'保單總覽'}</title><style>
