<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>保誠家庭保單總覽 | Prudential Family Policy Summary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --pru-red: #E31837;
  --pru-red-dark: #B5122B;
  --pru-red-light: #FEF0F2;
  --pru-navy: #003865;
  --pru-navy-mid: #004F8B;
  --pru-navy-light: #EAF1F8;
  --pru-navy-xlight: #F4F8FC;
  --white: #ffffff;
  --gray-50: #F8F9FA;
  --gray-100: #F0F2F5;
  --gray-200: #E2E6EA;
  --gray-400: #9AA5B4;
  --gray-600: #52606D;
  --gray-800: #1F2933;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.05);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { font-family: var(--font); background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

/* ─── OVERLAY ─── */
#overlay { position: fixed; inset: 0; background: var(--pru-navy); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
.ov-logo { color: var(--white); font-size: 28px; font-weight: 700; letter-spacing: -.5px; margin-bottom: 4px; }
.ov-sub { color: rgba(255,255,255,.5); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 40px; }
.ov-card { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 32px; width: 320px; }
.ov-label { color: rgba(255,255,255,.6); font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.ov-pin { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
.ov-dot { width: 48px; height: 52px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; color: var(--white); font-size: 22px; font-weight: 600; text-align: center; line-height: 52px; letter-spacing: 4px; cursor: default; }
.ov-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ov-key { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 10px; color: var(--white); font-size: 18px; font-weight: 500; height: 52px; cursor: pointer; transition: background .15s; font-family: var(--font); }
.ov-key:hover { background: rgba(255,255,255,.16); }
.ov-key.del { font-size: 14px; color: rgba(255,255,255,.5); }
.ov-key.empty { pointer-events: none; background: transparent; border-color: transparent; }
.ov-error { color: #FF6B6B; font-size: 12px; text-align: center; margin-top: 12px; min-height: 18px; }
.ov-hint { color: rgba(255,255,255,.3); font-size: 11px; text-align: center; margin-top: 16px; }

/* ─── SETUP MODAL ─── */
#setup-modal { display: none; position: fixed; inset: 0; background: rgba(0,56,101,.85); backdrop-filter: blur(8px); z-index: 900; align-items: center; justify-content: center; }
#setup-modal.show { display: flex; }
.setup-card { background: var(--white); border-radius: 16px; padding: 32px; width: 480px; max-width: 95vw; box-shadow: var(--shadow-lg); }
.setup-title { font-size: 18px; font-weight: 600; color: var(--pru-navy); margin-bottom: 6px; }
.setup-sub { font-size: 13px; color: var(--gray-600); margin-bottom: 24px; line-height: 1.6; }
.setup-step { display: flex; gap: 12px; margin-bottom: 20px; align-items: flex-start; }
.step-num { width: 24px; height: 24px; background: var(--pru-navy); color: var(--white); border-radius: 50%; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
.step-text { font-size: 13px; color: var(--gray-600); line-height: 1.6; }
.step-text a { color: var(--pru-navy-mid); }
.setup-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
.setup-input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 13px; color: var(--gray-800); }
.setup-input:focus { outline: none; border-color: var(--pru-navy); }
.btn-save-token { padding: 10px 18px; background: var(--pru-navy); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: var(--font); }
.btn-save-token:hover { background: var(--pru-navy-mid); }
.setup-token-status { font-size: 12px; color: var(--gray-400); }
.setup-token-status.ok { color: #276B0C; }
.setup-pin-row { display: flex; gap: 8px; align-items: center; margin-bottom: 20px; }
.setup-pin-input { width: 140px; padding: 10px 12px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--mono); font-size: 18px; letter-spacing: 8px; color: var(--gray-800); }
.setup-pin-input:focus { outline: none; border-color: var(--pru-navy); }
.btn-done { width: 100%; padding: 12px; background: var(--pru-red); color: var(--white); border: none; border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.btn-done:hover { background: var(--pru-red-dark); }

/* ─── MAIN LAYOUT ─── */
#app { display: none; min-height: 100vh; }
#app.show { display: block; }
.topbar { background: var(--pru-navy); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo { color: var(--white); font-size: 17px; font-weight: 700; }
.topbar-divider { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
.topbar-subtitle { color: rgba(255,255,255,.55); font-size: 12px; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.topbar-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); transition: all .15s; border: 1px solid transparent; }
.tb-ghost { background: rgba(255,255,255,.1); color: var(--white); border-color: rgba(255,255,255,.15); }
.tb-ghost:hover { background: rgba(255,255,255,.18); }
.tb-red { background: var(--pru-red); color: var(--white); }
.tb-red:hover { background: var(--pru-red-dark); }
.tb-white { background: var(--white); color: var(--pru-navy); }
.tb-white:hover { background: var(--gray-100); }
.red-bar { height: 3px; background: var(--pru-red); }

/* ─── SIDEBAR + CONTENT ─── */
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 59px); }
.sidebar { background: var(--white); border-right: 1px solid var(--gray-200); padding: 20px 0; overflow-y: auto; }
.sb-section { padding: 0 16px; margin-bottom: 4px; }
.sb-label { font-size: 10px; font-weight: 600; color: var(--gray-400); text-transform: uppercase; letter-spacing: .1em; padding: 8px 4px 6px; }
.sb-search { display: flex; align-items: center; gap: 8px; background: var(--gray-100); border-radius: var(--radius-sm); padding: 7px 10px; margin-bottom: 8px; }
.sb-search input { border: none; background: transparent; font-size: 13px; color: var(--gray-800); font-family: var(--font); flex: 1; outline: none; }
.sb-search input::placeholder { color: var(--gray-400); }
.sb-client { padding: 9px 20px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; border-left: 3px solid transparent; }
.sb-client:hover { background: var(--gray-50); }
.sb-client.active { background: var(--pru-navy-light); border-left-color: var(--pru-navy); }
.sb-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: var(--white); flex-shrink: 0; }
.sb-info { flex: 1; min-width: 0; }
.sb-name { font-size: 13px; font-weight: 500; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-meta { font-size: 11px; color: var(--gray-400); margin-top: 1px; }
.sb-new { padding: 8px 16px; }
.sb-new-btn { width: 100%; padding: 8px; background: none; border: 1px dashed var(--pru-red); border-radius: var(--radius-sm); color: var(--pru-red); font-size: 12px; font-weight: 500; cursor: pointer; font-family: var(--font); }
.sb-new-btn:hover { background: var(--pru-red-light); }
.sb-empty { padding: 20px 16px; text-align: center; color: var(--gray-400); font-size: 12px; line-height: 1.6; }

/* ─── MAIN CONTENT ─── */
.content { padding: 28px 32px; overflow-y: auto; background: var(--gray-50); }
.content-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.content-title { font-size: 20px; font-weight: 600; color: var(--pru-navy); }
.content-actions { display: flex; gap: 8px; }
.btn { padding: 8px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); border: 1px solid transparent; transition: all .15s; }
.btn-primary { background: var(--pru-navy); color: var(--white); }
.btn-primary:hover { background: var(--pru-navy-mid); }
.btn-danger { background: var(--pru-red); color: var(--white); }
.btn-danger:hover { background: var(--pru-red-dark); }
.btn-ghost { background: var(--white); color: var(--gray-600); border-color: var(--gray-200); }
.btn-ghost:hover { background: var(--gray-100); }

/* ─── FORM SECTIONS ─── */
.form-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); padding: 20px 24px; margin-bottom: 16px; box-shadow: var(--shadow); }
.form-card-title { font-size: 12px; font-weight: 600; color: var(--pru-navy); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 16px; padding-left: 10px; border-left: 3px solid var(--pru-red); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }
.grid1 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; }
.field label { font-size: 11px; font-weight: 500; color: var(--gray-600); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea { padding: 8px 10px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-sm); font-family: var(--font); font-size: 13px; color: var(--gray-800); transition: border-color .15s; background: var(--white); }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--pru-navy); }
.field textarea { resize: vertical; min-height: 52px; }

/* ─── POLICY CARDS ─── */
.policy-card { background: var(--gray-50); border: 1.5px solid var(--gray-200); border-top: 3px solid var(--pru-red); border-radius: 0 0 var(--radius) var(--radius); padding: 16px; margin-bottom: 10px; }
.policy-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.policy-type-sel { font-size: 12px; padding: 3px 10px; border-radius: 20px; border: 1px solid var(--gray-200); background: var(--white); font-family: var(--font); color: var(--pru-navy); font-weight: 500; cursor: pointer; }
.policy-remove { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 16px; padding: 2px; line-height: 1; }
.policy-remove:hover { color: var(--pru-red); }
.add-policy-btn { width: 100%; padding: 8px; background: none; border: 1px dashed var(--gray-200); border-radius: var(--radius-sm); color: var(--gray-400); font-size: 12px; cursor: pointer; font-family: var(--font); margin-top: 4px; }
.add-policy-btn:hover { background: var(--gray-100); color: var(--gray-600); }
.add-member-btn { width: 100%; padding: 10px; background: none; border: 1.5px dashed var(--pru-red); border-radius: var(--radius-sm); color: var(--pru-red); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font); margin-bottom: 16px; }
.add-member-btn:hover { background: var(--pru-red-light); }

/* ─── MEMBER CARD ─── */
.member-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); }
.member-header { background: var(--pru-navy); padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
.member-avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.2); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; }
.member-name-display { flex: 1; color: var(--white); font-size: 15px; font-weight: 600; }
.member-remove { background: none; border: none; cursor: pointer; color: rgba(255,255,255,.4); font-size: 18px; padding: 0; }
.member-remove:hover { color: rgba(255,255,255,.8); }
.member-body { padding: 16px; }
.member-policies-section { margin-top: 12px; }
.policies-label { font-size: 10px; font-weight: 600; color: var(--pru-navy); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; padding-left: 8px; border-left: 2px solid var(--pru-red); }

/* ─── EXTRA BOXES ─── */
.extra-box { border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; }
.med-box { background: var(--pru-navy-light); }
.acc-box { background: #FEF7EC; }
.sav-box { background: #EDF5E6; }
.extra-box-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; padding-left: 6px; border-left: 2px solid; border-radius: 0; }
.med-box .extra-box-title { color: var(--pru-navy); border-color: var(--pru-navy); }
.acc-box .extra-box-title { color: #7A4500; border-color: #EF9F27; }
.sav-box .extra-box-title { color: #276B0C; border-color: #276B0C; }
.sv-grid { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; align-items: center; }
.sv-cell { background: var(--white); border: 1px solid #c0dd97; border-radius: var(--radius-sm); padding: 8px 10px; text-align: center; }
.sv-cell-label { font-size: 10px; color: #276B0C; margin-bottom: 4px; }
.sv-cell input { border: none; background: transparent; font-size: 13px; font-weight: 600; text-align: center; width: 100%; padding: 0; font-family: var(--mono); color: #276B0C; outline: none; }
.autofill-badge { display: none; font-size: 10px; background: #EDF5E6; color: #276B0C; border: 1px solid #c0dd97; border-radius: 20px; padding: 1px 8px; margin-left: 6px; font-weight: 500; }

/* ─── PREVIEW ─── */
.preview-section { background: var(--white); border-radius: var(--radius); border: 1px solid var(--gray-200); overflow: hidden; box-shadow: var(--shadow); }
.pru-preview { font-family: Arial, Helvetica, sans-serif; color: #1a1a1a; font-size: 13px; }
.pru-header { background: #003865; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; }
.pru-logo { color: #fff; font-size: 20px; font-weight: 700; }
.pru-logo-sub { color: rgba(255,255,255,.55); font-size: 11px; margin-top: 2px; }
.pru-header-meta { text-align: right; font-size: 12px; color: rgba(255,255,255,.7); line-height: 1.8; }
.pru-redbar { height: 4px; background: #E31837; }
.pru-body { padding: 18px 20px; }
.pru-client-card { background: #EAF1F8; border-radius: 6px; padding: 12px 14px; margin-bottom: 14px; }
.pru-client-name { font-size: 17px; font-weight: 700; color: #003865; }
.pru-client-meta { font-size: 12px; color: #555; margin-top: 3px; }
.pru-total { display: flex; justify-content: space-between; align-items: center; background: #FEF0F2; border: 0.5px solid #f5c0c9; border-radius: 6px; padding: 10px 14px; margin-bottom: 14px; }
.pru-total-label { font-size: 12px; color: #B5122B; font-weight: 500; }
.pru-total-val { font-size: 18px; font-weight: 700; color: #E31837; }
.pru-member-block { margin-bottom: 16px; border: 0.5px solid #ddd; border-radius: 8px; overflow: hidden; }
.pru-member-header { background: #003865; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.pru-m-avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.pru-m-info { flex: 1; }
.pru-m-name { color: #fff; font-size: 15px; font-weight: 700; }
.pru-m-meta { color: rgba(255,255,255,.65); font-size: 11px; margin-top: 2px; }
.pru-m-total { font-size: 11px; color: rgba(255,255,255,.85); font-weight: 600; text-align: right; }
.pru-policies { padding: 12px 14px; }
.pru-policy { border: 0.5px solid #e8e8e8; border-radius: 6px; overflow: hidden; margin-bottom: 8px; }
.pru-policy-top { padding: 8px 12px; background: #f8f8f8; border-bottom: 0.5px solid #eee; display: flex; justify-content: space-between; align-items: flex-start; }
.pru-policy-name { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-top: 5px; }
.pru-policy-no { font-size: 10px; color: #888; margin-top: 2px; }
.pru-policy-prem { text-align: right; flex-shrink: 0; }
.pru-policy-mode { font-size: 11px; color: #888; }
.pru-policy-amount { font-size: 13px; font-weight: 700; color: #1a1a1a; }
.pru-policy-body { padding: 8px 12px; }
.pru-info-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.pru-info-cell .lbl { font-size: 10px; color: #888; margin-bottom: 2px; }
.pru-info-cell .val { font-size: 12px; font-weight: 600; color: #1a1a1a; }
.pru-med-box { margin-top: 8px; background: #EAF1F8; border-radius: 6px; padding: 8px 10px; }
.pru-acc-box { margin-top: 8px; background: #FEF7EC; border-radius: 6px; padding: 8px 10px; }
.pru-sav-box { margin-top: 8px; background: #EDF5E6; border-radius: 6px; padding: 8px 10px; }
.pru-box-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; padding-left: 5px; border-left: 2px solid; border-radius: 0; }
.pru-badge { font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; border: 0.5px solid; display: inline-block; margin-bottom: 5px; }
.pru-footer { background: #003865; padding: 12px 20px; font-size: 10.5px; color: rgba(255,255,255,.55); line-height: 1.8; }
.pru-footer-rmk { background: #EAF1F8; border-left: 3px solid #003865; padding: 10px 14px; margin-top: 8px; font-size: 12px; color: #003865; }

/* ─── STATUS TOAST ─── */
#toast { position: fixed; bottom: 24px; right: 24px; background: var(--gray-800); color: var(--white); padding: 10px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; z-index: 9999; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateY(0); }
#toast.ok { background: #276B0C; }
#toast.err { background: var(--pru-red); }

/* ─── CLIENT MODAL ─── */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 800; align-items: center; justify-content: center; }
.modal-backdrop.show { display: flex; }
.modal-card { background: var(--white); border-radius: 14px; padding: 28px; width: 420px; max-width: 95vw; }
.modal-title { font-size: 16px; font-weight: 600; color: var(--pru-navy); margin-bottom: 16px; }
.modal-list { max-height: 300px; overflow-y: auto; margin-bottom: 16px; }
.modal-client-row { padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background .1s; }
.modal-client-row:hover { background: var(--pru-navy-light); }
.modal-client-name { font-size: 14px; font-weight: 500; color: var(--gray-800); }
.modal-client-meta { font-size: 11px; color: var(--gray-400); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-search { display: flex; align-items: center; gap: 8px; background: var(--gray-100); border-radius: var(--radius-sm); padding: 8px 12px; margin-bottom: 12px; }
.modal-search input { border: none; background: transparent; font-size: 14px; font-family: var(--font); flex: 1; outline: none; }
.modal-empty { text-align: center; color: var(--gray-400); font-size: 13px; padding: 24px; }

/* ─── UTIL ─── */
.hidden { display: none !important; }
.mb0 { margin-bottom: 0; }
</style>
</head>
<body>

<!-- PIN OVERLAY -->
<div id="overlay">
  <div class="ov-logo">保誠保險</div>
  <div class="ov-sub">Family Policy Summary Tool</div>
  <div class="ov-card">
    <div class="ov-label">輸入 PIN 碼</div>
    <div class="ov-pin">
      <div class="ov-dot" id="d0">·</div>
      <div class="ov-dot" id="d1">·</div>
      <div class="ov-dot" id="d2">·</div>
      <div class="ov-dot" id="d3">·</div>
    </div>
    <div class="ov-keypad">
      <button class="ov-key" onclick="pinKey('1')">1</button>
      <button class="ov-key" onclick="pinKey('2')">2</button>

function pinKey(k) {
  if (pinInput.length >= 4) return;
  pinInput += k;
  updatePinDots();
  if (pinInput.length === 4) setTimeout(checkPin, 200);
}
function pinDel() { pinInput = pinInput.slice(0,-1); updatePinDots(); }
function updatePinDots() {
  for(let i=0;i<4;i++){
    document.getElementById('d'+i).textContent = i < pinInput.length ? '●' : '·';
  }
}
function checkPin() {
  const stored = localStorage.getItem('pru_pin');
  if (!stored) { openSetupModal(); return; }
  if (pinInput === stored) {
    document.getElementById('overlay').style.display='none';
    document.getElementById('app').classList.add('show');
    loadSidebar();
  } else {
    document.getElementById('pin-error').textContent='PIN 碼錯誤，請重試';
    pinInput=''; updatePinDots();
    setTimeout(()=>document.getElementById('pin-error').textContent='',2000);
  }
}

function openSetupModal() {
  document.getElementById('setup-modal').classList.add('show');
  document.getElementById('pin-hint').textContent='請先完成設定';
}
async function verifyToken() {
  const token = document.getElementById('token-input').value.trim();
  if(!token){showToast('請輸入 Token','err');return;}
  const st=document.getElementById('token-status');
  st.textContent='驗證中...';st.className='setup-token-status';
  try{
    const r=await fetch('https://api.github.com/gists?per_page=1',{headers:{Authorization:'token '+token}});
    if(r.ok){st.textContent='✓ 驗證成功';st.className='setup-token-status ok';localStorage.setItem('pru_gh_token',token);}
    else{st.textContent='✗ Token 無效，請重試';st.className='setup-token-status';}
  }catch(e){st.textContent='✗ 網絡錯誤';st.className='setup-token-status';}
}
function saveSetup() {
  const pin=document.getElementById('pin-setup').value;
  const token=localStorage.getItem('pru_gh_token');
  if(!token){showToast('請先驗證 Token','err');return;}
  if(pin.length!==4||!/^\d+$/.test(pin)){showToast('請輸入4位數字PIN','err');return;}
  localStorage.setItem('pru_pin',pin);
  document.getElementById('setup-modal').classList.remove('show');
  document.getElementById('overlay').style.display='none';
  document.getElementById('app').classList.add('show');
  loadSidebar();
  showToast('設定完成！','ok');
}
function showSettings() {
  localStorage.removeItem('pru_pin');localStorage.removeItem('pru_gh_token');
  location.reload();
}

// GIST
// ════════════════════════════════════════
function getToken(){return localStorage.getItem('pru_gh_token')||'';}

async function loadSidebar() {
  const token=getToken();if(!token)return;
  try{
    const r=await fetch('https://api.github.com/gists?per_page=100',{headers:{Authorization:'token '+token}});
    const data=await r.json();
    allGists=data.filter(g=>g.description&&g.description.startsWith('PRU_CLIENT:'));
    renderSidebar(allGists);
  }catch(e){console.error(e);}
}

function renderSidebar(gists) {
  const el=document.getElementById('sb-client-list');
  if(!gists.length){el.innerHTML='<div class="sb-empty">尚未有客戶記錄</div>';return;}
  el.innerHTML=gists.map((g,i)=>{
    const name=g.description.replace('PRU_CLIENT:','');
    const date=new Date(g.updated_at).toLocaleDateString('zh-HK');
    const col=AVBG[i%AVBG.length];
    return`<div class="sb-client" onclick="loadGist('${g.id}')" id="sb-${g.id}">
      <div class="sb-avatar" style="background:${col}">${name.charAt(0)}</div>
      <div class="sb-info"><div class="sb-name">${name}</div><div class="sb-meta">${date}</div></div>
    </div>`;
  }).join('');
}

function filterSidebar(){
  const q=document.getElementById('sb-search').value.toLowerCase();
  const filtered=allGists.filter(g=>g.description.toLowerCase().includes(q));
  renderSidebar(filtered);
}

async function loadGist(id){
  const token=getToken();
  try{
    const r=await fetch(`https://api.github.com/gists/${id}`,{headers:{Authorization:'token '+token}});
    const g=await r.json();
    const file=Object.values(g.files)[0];
    const data=JSON.parse(file.content);
    currentGistId=id;
    loadFormData(data);
    document.querySelectorAll('.sb-client').forEach(el=>el.classList.remove('active'));
    const sb=document.getElementById('sb-'+id);
    if(sb)sb.classList.add('active');
    showToast('已載入：'+data.fname,'ok');
  }catch(e){showToast('載入失敗','err');}
}

async function saveToGist(){
  const token=getToken();if(!token){showToast('未設定 Token','err');return;}
  const data=collectFormData();
  const name=data.fname||'未命名客戶';
  const content=JSON.stringify(data,null,2);
  try{
    let r,method,url;
    if(currentGistId){
      method='PATCH';url=`https://api.github.com/gists/${currentGistId}`;
    }else{
      method='POST';url='https://api.github.com/gists';
    }
    r=await fetch(url,{method,headers:{Authorization:'token '+token,'Content-Type':'application/json'},
      body:JSON.stringify({description:'PRU_CLIENT:'+name,public:false,files:{'client.json':{content}}})});
    const g=await r.json();
    currentGistId=g.id;
    await loadSidebar();
    showToast('已儲存：'+name,'ok');
  }catch(e){showToast('儲存失敗','err');}
}

function closeClientModal(){document.getElementById('client-modal').classList.remove('show');}
function renderModalList(gists){
  const el=document.getElementById('modal-list');
  if(!gists.length){el.innerHTML='<div class="modal-empty">未有客戶記錄</div>';return;}
  el.innerHTML=gists.map((g,i)=>{

    return`<div class="modal-client-row" onclick="loadGist('${g.id}');closeClientModal()">

function updateTitle(){

function buildTypeOpts(){return Object.keys(PRODUCTS).map(t=>`<option value="${t}">${TYPE_ZH[t]}</option>`).join('');}

  <div class="member-card" id="${mid}">
    <div class="member-header">
      <div class="member-avatar" id="${mid}av" style="background:${col}">${nm?nm.charAt(0):'家'}</div>
      <div class="member-name-display" id="${mid}ttl">${nm||'新成員'}</div>

        <div class="field"><label>受保人</label><input type="text" id="${mid}ins" value="${data?data.insured:''}" placeholder="本人"></div>
        <div class="field"><label>受益人</label><input type="text" id="${mid}ben" value="${data?data.beneficiary:''}" placeholder="配偶/子女"></div>
        <div class="field"><label>吸煙</label><select id="${mid}sk"><option value="NS" ${!data||data.smoke==='NS'?'selected':''}>非吸煙</option><option value="S" ${data&&data.smoke==='S'?'selected':''}>吸煙</option></select></div>

function updMember(mid){
  const nm=document.getElementById(mid+'nm').value;
  document.getElementById(mid+'ttl').textContent=nm||'新成員';
  document.getElementById(mid+'av').textContent=nm?nm.charAt(0):'家';
}

      <div class="grid2" style="margin-bottom:8px;">
        <div class="field"><label>病房級別</label><select id="${pid}wd" onchange="onWardChange('${pid}')" style="font-size:13px;"><option value="">選擇病房</option></select></div>
        <div class="field"><label>自付額</label>

function initMedSelects(pid, data){
  const wdSel=document.getElementById(pid+'wd');
  const ddSel=document.getElementById(pid+'ddsel');
  if(!wdSel||!ddSel)return;
  wdSel.innerHTML='<option value="">選擇病房</option>'+['私家病房','半私家病房','普通病房','不設病房限制'].map(w=>`<option value="${w}" ${data&&data.ward===w?'selected':''}>${w}</option>`).join('');
  ddSel.innerHTML='<option value="">選擇自付額</option><option value="custom">自行輸入</option>';
  const pick=document.getElementById(pid+'npick');
  if(pick){const parts=pick.value.split('||');const key=parts[2]||'';autofillMedical(pid,key,data);}
  if(data&&data.deductible){
    const ddSel2=document.getElementById(pid+'ddsel');
    const found=[...ddSel2.options].some(o=>o.value===data.deductible);
    if(!found){ddSel2.insertAdjacentHTML('beforeend',`<option value="${data.deductible}" selected>${data.deductible}</option>`);}
    else{ddSel2.value=data.deductible;}
  }
}

function onTypeChange(pid){
  const t=document.getElementById(pid+'t').value;
  const pick=document.getElementById(pid+'npick');
  if(pick)pick.innerHTML=buildProdOpts(t);
  onPlanPick(pid);
  ['med','acc','sav'].forEach(k=>{const el=document.getElementById(pid+k);if(el)el.style.display='none';});
  if(t==='medical'){const el=document.getElementById(pid+'med');if(el)el.style.display='block';}
  else if(t==='accident'){const el=document.getElementById(pid+'acc');if(el)el.style.display='block';}
  else if(t==='savings'||t==='income'){const el=document.getElementById(pid+'sav');if(el)el.style.display='block';}
}

function onPlanPick(pid){
  const pick=document.getElementById(pid+'npick');
  const custom=document.getElementById(pid+'ncustom');
  if(!pick||!custom)return;
  const isC=pick.value.includes('自行輸入')||pick.value.includes('custom');
  custom.style.display=isC?'block':'none';
  const parts=pick.value.split('||');
  autofillMedical(pid,parts[2]||'',null);
}

function autofillMedical(pid,key,data){
  const badge=document.getElementById(pid+'autobadge');
  const wdSel=document.getElementById(pid+'wd');
  const ddSel=document.getElementById(pid+'ddsel');
  const alInput=document.getElementById(pid+'al');
  const llInput=document.getElementById(pid+'ll');
  if(!wdSel||!ddSel||!alInput||!llInput)return;
  const mdata=key?MEDICAL_DATA[key]:null;
  if(!mdata){if(badge)badge.style.display='none';return;}
  if(badge)badge.style.display='inline-block';
  const savedWard=data?data.ward:null;
  wdSel.innerHTML='<option value="">選擇病房</option>'+mdata.wards.map(w=>`<option value="${w}" ${savedWard===w?'selected':''}>${w}</option>`).join('');
  if(mdata.wards.length===1&&!savedWard)wdSel.value=mdata.wards[0];
  ddSel.innerHTML='<option value="">選擇自付額</option>'+mdata.deductibles.map(d=>`<option value="${d}">${d}</option>`).join('')+'<option value="custom">自行輸入</option>';
  if(!data){
    llInput.value=mdata.lifetimeLimit||'';
    if(mdata.wards.length===1)alInput.value=mdata.annualLimits[mdata.wards[0]]||'';
  }
}

function onWardChange(pid){
  const pick=document.getElementById(pid+'npick');
  const wdSel=document.getElementById(pid+'wd');
  const alInput=document.getElementById(pid+'al');
  if(!pick||!wdSel||!alInput)return;
  const key=pick.value.split('||')[2]||'';
  const mdata=key?MEDICAL_DATA[key]:null;
  if(mdata&&mdata.annualLimits&&mdata.annualLimits[wdSel.value])alInput.value=mdata.annualLimits[wdSel.value];
}

function onDdChange(pid){
  const ddSel=document.getElementById(pid+'ddsel');
  const ddInput=document.getElementById(pid+'dd');
  if(!ddSel||!ddInput)return;
  ddInput.style.display=ddSel.value==='custom'?'block':'none';
}

function getPlanName(pid){
  const pick=document.getElementById(pid+'npick');
  const custom=document.getElementById(pid+'ncustom');
  if(!pick)return'';
  const isC=pick.value.includes('自行輸入')||pick.value.includes('custom');
  if(isC)return custom?custom.value:'';
  return pick.value.split('||')[0]||'';
}
function getWard(pid){const s=document.getElementById(pid+'wd');return s?s.value||'—':'—';}
function getDd(pid){const s=document.getElementById(pid+'ddsel');const i=document.getElementById(pid+'dd');if(!s)return'—';return s.value==='custom'?(i?i.value||'—':'—'):(s.value||'—');}

// COLLECT / LOAD DATA
// ════════════════════════════════════════
function collectFormData(){
  const members=[...document.querySelectorAll('.member-card')].map(m=>{
    const mid=m.id;
    const policies=[...m.querySelectorAll('.policy-card')].map(p=>{
      const pid=p.id;
      const type=document.getElementById(pid+'t').value;
      return{
        type,planName:getPlanName(pid),
        policyNo:v(pid+'no'),mode:v(pid+'m'),currency:v(pid+'c'),
        premium:v(pid+'pr'),sumAssured:v(pid+'sa'),
        effectiveDate:v(pid+'e'),paymentTerm:v(pid+'tm'),nextReview:v(pid+'rv'),
        ward:getWard(pid),deductible:getDd(pid),
        annualLimit:v(pid+'al'),lifetimeLimit:v(pid+'ll'),
        accMed:v(pid+'am'),accDeath:v(pid+'ad'),accDisable:v(pid+'ap'),
        sv65:v(pid+'s65'),sv75:v(pid+'s75'),svcur:v(pid+'svc')
      };
    });
    return{name:v(mid+'nm'),dob:v(mid+'dob'),role:v(mid+'rel'),owner:v(mid+'own'),insured:v(mid+'ins'),beneficiary:v(mid+'ben'),smoke:v(mid+'sk'),policies};
  });
  return{fname:v('fname'),rdate:v('rdate'),adv:v('adv'),remarks:v('remarks'),members};
}

function v(id){const el=document.getElementById(id);return el?el.value:'';}

function loadFormData(data){
  mc=0;pC={};
  document.getElementById('fname').value=data.fname||'';
  document.getElementById('rdate').value=data.rdate||new Date().toISOString().split('T')[0];
  document.getElementById('adv').value=data.adv||'';
  document.getElementById('remarks').value=data.remarks||'';
  document.getElementById('members-container').innerHTML='';
  document.getElementById('preview-section').classList.add('hidden');
  if(data.members&&data.members.length){data.members.forEach(m=>addMember(m));}
  else{addMember();}
  updateTitle();
}

function fD(v){if(!v)return'—';const d=new Date(v);if(isNaN(d))return v;return`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function getAge(dob){if(!dob)return'';const d=new Date(dob),now=new Date();const age=now.getFullYear()-d.getFullYear()-(now<new Date(now.getFullYear(),d.getMonth(),d.getDate())?1:0);return`${age}歲`;}
function ic(l,v2){return`<div class="pru-info-cell"><div class="lbl">${l}</div><div class="val">${v2}</div></div>`;}

function generatePreview(){
  const data=collectFormData();
  const fname=data.fname||'家庭';
  const rdt=fD(data.rdate)||fD(new Date().toISOString().split('T')[0]);
  const adv=data.adv||'';
  const rmk=data.remarks;
  let grand=0,grandCur=null,mHTML='';

  data.members.forEach(m=>{
    const bk=BADGE;
    let pH='',mTot=0,mCur=null;
    m.policies.forEach((p,i)=>{
      const bkp=BADGE[p.type]||BADGE.life;
      const tn=TYPE_ZH[p.type]||p.type;
      const raw=parseFloat((p.premium||'0').replace(/,/g,''));
      if(!isNaN(raw)&&raw>0){const a=p.mode==='monthly'?raw*12:p.mode==='quarterly'?raw*4:raw;if(!mCur||mCur===p.currency){mTot+=a;mCur=p.currency;}if(!grandCur||grandCur===p.currency){grand+=a;grandCur=p.currency;}}
      let ex='';
      if(p.type==='medical'){
        ex=`<div class="pru-med-box"><div class="pru-box-title" style="color:#003865;border-color:#003865;">醫療保障詳情</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;">${ic('病房級別',p.ward||'—')}${ic('每年保額',p.annualLimit||'—')}${ic('終生保額',p.lifetimeLimit||'—')}${ic('自付額',p.deductible||'—')}</div></div>`;
      }else if(p.type==='accident'){
        ex=`<div class="pru-acc-box"><div class="pru-box-title" style="color:#7A4500;border-color:#EF9F27;">意外保障詳情</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">${ic('意外醫療',p.accMed?p.currency+' '+p.accMed:'—')}${ic('身故',p.accDeath?p.currency+' '+p.accDeath:'—')}${ic('永久傷殘',p.accDisable?p.currency+' '+p.accDisable:'—')}</div></div>`;
      }else if(p.type==='savings'||p.type==='income'){
        if(p.sv65||p.sv75)ex=`<div class="pru-sav-box"><div class="pru-box-title" style="color:#276B0C;border-color:#276B0C;">退保價值</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div style="background:#fff;border-radius:5px;padding:7px 10px;text-align:center;border:0.5px solid #c0dd97;"><div style="font-size:10px;color:#276B0C;margin-bottom:3px;">65歲退保值</div><div style="font-size:14px;font-weight:700;color:#276B0C;">${p.svcur} ${p.sv65||'—'}</div></div><div style="background:#fff;border-radius:5px;padding:7px 10px;text-align:center;border:0.5px solid #c0dd97;"><div style="font-size:10px;color:#276B0C;margin-bottom:3px;">75歲退保值</div><div style="font-size:14px;font-weight:700;color:#276B0C;">${p.svcur} ${p.sv75||'—'}</div></div></div></div>`;
      }
      pH+=`<div class="pru-policy"><div class="pru-policy-top"><div><span class="pru-badge" style="background:${bkp.bg};color:${bkp.color};border-color:${bkp.border};">${tn}</span><div class="pru-policy-name">${p.planName||tn}</div>${p.policyNo?`<div class="pru-policy-no">保單號：${p.policyNo}</div>`:''}</div><div class="pru-policy-prem"><div class="pru-policy-mode">{{mode}}</div><div class="pru-policy-amount">${p.premium?p.currency+' '+p.premium:'—'}</div></div></div><div class="pru-policy-body"><div class="pru-info-grid">${ic('保額',p.sumAssured?p.currency+' '+p.sumAssured:'—')}${ic('生效日',fD(p.effectiveDate))}${ic('繳費年期',p.paymentTerm||'—')}</div>${ex}</div></div>`.replace('{{mode}}',{annual:'年繳',monthly:'月繳',quarterly:'季繳'}[p.mode]||'');
    });
    const mt=mTot>0&&mCur?`<div class="pru-m-total">年保費: ${mCur} ${Math.round(mTot).toLocaleString()}</div>`:'';
    const age=getAge(m.dob);
    const rel=m.role?m.role.split('/')[0]:m.role;
    mHTML+=`<div class="pru-member-block"><div class="pru-member-header"><div class="pru-m-avatar">${m.name?m.name.charAt(0):'?'}</div><div class="pru-m-info"><div class="pru-m-name">${m.name||'（未填）'} <span style="font-size:12px;font-weight:400;opacity:.7;">${rel||''}${age?' · '+age:''}</span></div><div class="pru-m-meta">投保人: ${m.owner||'—'} | 受保人: ${m.insured||'—'} | 受益人: ${m.beneficiary||'—'} | ${m.smoke==='NS'?'非吸煙':'吸煙'}</div></div>${mt}</div><div class="pru-policies">${pH||'<div style="text-align:center;color:#aaa;font-size:12px;padding:1rem;">未有保單記錄</div>'}</div></div>`;
  });

  const totB=grand>0&&grandCur?`<div class="pru-total"><div class="pru-total-label">全家年度總保費</div><div class="pru-total-val">${grandCur} ${Math.round(grand).toLocaleString()}</div></div>`:'';
  const rmkB=rmk?`<div class="pru-footer-rmk"><strong>顧問備註：</strong>${rmk}</div>`:'';

  document.getElementById('preview-frame').innerHTML=`
    <div class="pru-header"><div><div class="pru-logo">保誠保險</div><div class="pru-logo-sub">家庭保單總覽 — ${fname}</div></div><div class="pru-header-meta">報告日期: ${rdt}${adv?'<br>顧問: '+adv:''}</div></div>
    <div class="pru-redbar"></div>
    <div class="pru-body">
      ${totB}${mHTML}${rmkB}
    </div>
    <div class="pru-footer">保誠保險理財顧問${adv?' · '+adv:''} | ${rdt}<br>本摘要僅供參考，詳細條款請參閱原保單文件。如有疑問，請聯絡您的顧問。</div>`;

  document.getElementById('preview-section').classList.remove('hidden');
  document.getElementById('preview-section').scrollIntoView({behavior:'smooth'});
}

function doPrint(){
  const c=document.getElementById('preview-frame').innerHTML;
  if(!c){generatePreview();setTimeout(doPrint,500);return;}
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>家庭保單總覽</title><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Arial,Helvetica,sans-serif;max-width:820px;margin:0 auto;color:#1a1a1a;font-size:13px;}.pru-header{background:#003865;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;}.pru-logo{color:#fff;font-size:20px;font-weight:700;}.pru-logo-sub{color:rgba(255,255,255,.55);font-size:11px;margin-top:2px;}.pru-header-meta{text-align:right;font-size:12px;color:rgba(255,255,255,.7);line-height:1.8;}.pru-redbar{height:4px;background:#E31837;}.pru-body{padding:18px 20px;}.pru-total{display:flex;justify-content:space-between;align-items:center;background:#FEF0F2;border:0.5px solid #f5c0c9;border-radius:6px;padding:10px 14px;margin-bottom:14px;}.pru-total-label{font-size:12px;color:#B5122B;font-weight:500;}.pru-total-val{font-size:18px;font-weight:700;color:#E31837;}.pru-member-block{margin-bottom:16px;border:0.5px solid #ddd;border-radius:8px;overflow:hidden;}.pru-member-header{background:#003865;padding:10px 14px;display:flex;align-items:center;gap:10px;}.pru-m-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex-shrink:0;}.pru-m-info{flex:1;}.pru-m-name{color:#fff;font-size:15px;font-weight:700;}.pru-m-meta{color:rgba(255,255,255,.65);font-size:11px;margin-top:2px;}.pru-m-total{font-size:11px;color:rgba(255,255,255,.85);font-weight:600;text-align:right;}.pru-policies{padding:12px 14px;}.pru-policy{border:0.5px solid #e8e8e8;border-radius:6px;overflow:hidden;margin-bottom:8px;}.pru-policy-top{padding:8px 12px;background:#f8f8f8;border-bottom:0.5px solid #eee;display:flex;justify-content:space-between;align-items:flex-start;}.pru-policy-name{font-size:13px;font-weight:700;color:#1a1a1a;margin-top:5px;}.pru-policy-no{font-size:10px;color:#888;margin-top:2px;}.pru-policy-prem{text-align:right;flex-shrink:0;}.pru-policy-mode{font-size:11px;color:#888;}.pru-policy-amount{font-size:13px;font-weight:700;color:#1a1a1a;}.pru-policy-body{padding:8px 12px;}.pru-info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}.pru-info-cell .lbl{font-size:10px;color:#888;margin-bottom:2px;}.pru-info-cell .val{font-size:12px;font-weight:600;color:#1a1a1a;}.pru-med-box,.pru-acc-box,.pru-sav-box{margin-top:8px;border-radius:6px;padding:8px 10px;}.pru-med-box{background:#EAF1F8;}.pru-acc-box{background:#FEF7EC;}.pru-sav-box{background:#EDF5E6;}.pru-box-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;padding-left:5px;border-left:2px solid;}.pru-badge{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;border:0.5px solid;display:inline-block;margin-bottom:5px;}.pru-footer{background:#003865;padding:12px 20px;font-size:10.5px;color:rgba(255,255,255,.55);line-height:1.8;}.pru-footer-rmk{background:#EAF1F8;border-left:3px solid #003865;padding:10px 14px;margin-top:8px;font-size:12px;color:#003865;}@media print{body{max-width:100%;} .pru-member-block{page-break-inside:avoid;}}</style></head><body>${c}</body></html>`);
  w.document.close();w.focus();setTimeout(()=>{w.print();},400);
}

let toastTimer;
function showToast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(type||'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.className='';},2800);
}

  document.getElementById('pin-hint').textContent='首次使用請完成設定';
